services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: math_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MATH_DB_ADMIN_PASSWORD:?请提供独立的数据库管理密码}
      MATH_DB_PASSWORD: ${MATH_DB_PASSWORD:?请通过服务器环境变量提供应用数据库密码}
    volumes:
      - math_data:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/01-app.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d math_lab"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://math_app:${MATH_DB_PASSWORD}@db:5432/math_lab
      APP_ORIGIN: ${MATH_APP_ORIGIN:?请提供网站HTTPS地址}
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:8766:8766"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8766/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
volumes:
  math_data:
