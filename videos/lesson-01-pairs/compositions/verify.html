abel="放回原来的两次购买，检验"><g id="verify-prices"><rect x="50" y="25" width="1640" height="90" rx="22" fill="#243047"/><rect x="45" y="20" width="1640" height="90" rx="22" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="70" y="68" font-size="43" font-weight="500" text-anchor="start" fill="#243047">橡皮：2.2元/块　　铅笔：0.8元/支</text></g><g id="verify-first"><rect x="50" y="178" width="1640" height="95" rx="22" fill="#243047"/><rect x="45" y="173" width="1640" height="95" rx="22" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="70" y="221" font-size="40" font-weight="500" text-anchor="start" fill="#243047">第一次：3 × 2.2 ＋ 5 × 0.8 ＝ 10.6元  ✓</text></g><g id="verify-second"><rect x="50" y="320" width="1640" height="95" rx="22" fill="#243047"/><rect x="45" y="315" width="1640" height="95" rx="22" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="70" y="363" font-size="40" font-weight="500" text-anchor="start" fill="#243047">第二次：4 × 2.2 ＋ 4 × 0.8 ＝ 12元  ✓</text></g><g id="verify-summary"><rect x="50" y="465" width="1640" height="95" rx="22" fill="#243047"/><rect x="45" y="460" width="1640" height="95" rx="22" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="70" y="508" font-size="42" font-weight="500" text-anchor="start" fill="#243047">配成一套 → 算已知部分 → 求剩余 → 检验</text></g><g id="verify-limit"><text x="90" y="652" font-size="36" font-weight="600" text-anchor="start" fill="#243047">先观察条件，能组成相同的一套时，再这样想。</text></g></svg><div class="clip subtitle" id="verify-sub0" data-start="0.75" data-duration="5.471" data-track-index="5">把橡皮二点二元、铅笔零点八元，放回第一种买法。</div><div class="clip subtitle" id="verify-sub1" data-start="6.221" data-duration="6.513" data-track-index="5">三块橡皮六点六元，五支铅笔四元，共十点六元，符合。</div><div class="clip subtitle" id="verify-sub2" data-start="13.298" data-duration="8.406" data-track-index="5">第二种买法：四块橡皮八点八元，四支铅笔三点二元，共十二元，也符合。</div><div class="clip subtitle" id="verify-sub3" data-start="22.222" data-duration="11.182" data-track-index="5">这道题的路线是：配成相同的一套，先求一套的价钱；再圈出已知费用的部分，算剩下的商品，最后代回检验。</div><div class="clip subtitle" id="verify-sub4" data-start="33.978" data-duration="8.365" data-track-index="5">配套方便，是因为这道题恰好有四块橡皮和四支铅笔，可以分成四个相同组合。</div><div class="clip subtitle" id="verify-sub5" data-start="42.343" data-duration="6.201" data-track-index="5">以后遇到新题，也要先观察条件，不能看到两种商品就照搬。</div><div class="bar" id="verify-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#verify-first',{"opacity":0,"x":-90});tl.to('#verify-first',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},4.65);gsap.set('#verify-second',{"opacity":0,"x":90});tl.to('#verify-second',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},16.198);gsap.set('#verify-summary',{"opacity":0,"y":20});tl.to('#verify-summary',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},22.122);gsap.set('#verify-limit',{"opacity":0,"y":20});tl.to('#verify-limit',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},33.878);tl.fromTo('#verify-heading',{x:-35,opacity:0},{x:0,opacity:1,duration:.6,ease:'power3.out'},0);tl.fromTo('#verify-progress',{scaleX:0},{scaleX:1,duration:49.708333333333336,ease:'none'},0);window.__timelines['verify']=tl;}</script></template></body></html>
