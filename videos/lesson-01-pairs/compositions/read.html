"270" rx="22" fill="#243047"/><rect x="20" y="12" width="1700" height="270" rx="22" fill="white" stroke="#243047" stroke-width="3"/><text x="60" y="73" font-size="42" font-weight="500" text-anchor="start" fill="#243047">学校第一次买了3个水瓶和20个茶杯，共用去134元；</text><text x="60" y="149" font-size="42" font-weight="500" text-anchor="start" fill="#243047">第二次买了同样的3个水瓶和16个茶杯，共用去118元。</text><text x="60" y="225" font-size="42" font-weight="500" text-anchor="start" fill="#243047">水瓶和茶杯的单价各是多少元？</text><g id="read-underline1"><path d="M352 88H1290" stroke="#FFD43B" stroke-width="9" stroke-linecap="round"/></g><g id="read-underline2"><path d="M70 164H1270" stroke="#45C7FF" stroke-width="9" stroke-linecap="round"/></g><g id="read-order1"><rect x="45" y="332" width="1640" height="105" rx="22" fill="#243047"/><rect x="40" y="327" width="1640" height="105" rx="22" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="65" y="375" font-size="42" font-weight="500" text-anchor="start" fill="#243047">第一次：3个水瓶 ＋ 20个茶杯 ＝ 134元</text></g><g id="read-order2"><rect x="45" y="475" width="1640" height="105" rx="22" fill="#243047"/><rect x="40" y="470" width="1640" height="105" rx="22" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="65" y="518" font-size="42" font-weight="500" text-anchor="start" fill="#243047">第二次：3个水瓶 ＋ 16个茶杯 ＝ 118元</text></g><g id="read-note"><text x="65" y="647" font-size="34" font-weight="600" text-anchor="start" fill="#243047">总价：整次购买的钱　　单价：一个商品的价格</text></g></svg><div class="clip subtitle" id="read-sub0" data-start="0.75" data-duration="4.9" data-track-index="5">今天，我们从一道完整的应用题出发，学会消去。</div><div class="clip subtitle" id="read-sub1" data-start="5.65" data-duration="4.067" data-track-index="5">先读题，再一起找出每一步的理由。</div><div class="clip subtitle" id="read-sub2" data-start="10.274" data-duration="6.572" data-track-index="5">学校第一次买了三个水瓶和二十个茶杯，共用去一百三十四元。</div><div class="clip subtitle" id="read-sub3" data-start="17.35" data-duration="6.517" data-track-index="5">第二次买了同样的三个水瓶和十六个茶杯，共用去一百一十八元。</div><div class="clip subtitle" id="read-sub4" data-start="23.867" data-duration="3.796" data-track-index="5">水瓶和茶杯的单价各是多少元？</div><div class="clip subtitle" id="read-sub5" data-start="28.218" data-duration="3.922" data-track-index="5">这里的两个金额，都是整次购物的总价。</div><div class="clip subtitle" id="read-sub6" data-start="32.14" data-duration="5.679" data-track-index="5">题目要找的单价，是一个水瓶和一个茶杯各要多少钱。</div><div class="clip subtitle" id="read-sub7" data-start="37.819" data-duration="5.779" data-track-index="5">把文字整理成两张购物单，注意相同商品的单价相同。</div><div class="bar" id="read-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#read-underline1',{strokeDasharray:1800,strokeDashoffset:1800});tl.to('#read-underline1',{"duration":1.2,"ease":"none","strokeDashoffset":0},10.174);gsap.set('#read-underline2',{strokeDasharray:1800,strokeDashoffset:1800});tl.to('#read-underline2',{"duration":1.2,"ease":"none","strokeDashoffset":0},17.25);gsap.set('#read-order1',{"opacity":0,"x":-150});tl.to('#read-order1',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},12.174);gsap.set('#read-order2',{"opacity":0,"x":150});tl.to('#read-order2',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},20.25);gsap.set('#read-note',{"opacity":0,"y":20});tl.to('#read-note',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},28.118);tl.fromTo('#read-heading',{x:-35,opacity:0},{x:0,opacity:1,duration:.6,ease:'power3.out'},0);tl.fromTo('#read-progress',{scaleX:0},{scaleX:1,duration:44.791666666666664,ease:'none'},0);window.__timelines['read']=tl;}</script></template></body></html>
