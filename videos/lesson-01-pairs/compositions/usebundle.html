roke-width="3"/><path d="M20 17H38M29 21V50M24 59H34" stroke="#243047" stroke-width="2.5"/></g></g><g id="usebundle-p1"><g transform="translate(435 400) scale(1.35)"><path d="M20 10Q20 4 29 4Q38 4 38 10V51L29 68L20 51Z" fill="#FFD43B" stroke="#243047" stroke-width="3"/><path d="M20 17H38M29 21V50M24 59H34" stroke="#243047" stroke-width="2.5"/></g></g><g id="usebundle-p2"><g transform="translate(715 400) scale(1.35)"><path d="M20 10Q20 4 29 4Q38 4 38 10V51L29 68L20 51Z" fill="#FFD43B" stroke="#243047" stroke-width="3"/><path d="M20 17H38M29 21V50M24 59H34" stroke="#243047" stroke-width="2.5"/></g></g><g id="usebundle-p3"><g transform="translate(995 400) scale(1.35)"><path d="M20 10Q20 4 29 4Q38 4 38 10V51L29 68L20 51Z" fill="#FFD43B" stroke="#243047" stroke-width="3"/><path d="M20 17H38M29 21V50M24 59H34" stroke="#243047" stroke-width="2.5"/></g></g><g id="usebundle-p4"><g transform="translate(1275 400) scale(1.35)"><path d="M20 10Q20 4 29 4Q38 4 38 10V51L29 68L20 51Z" fill="#FFD43B" stroke="#243047" stroke-width="3"/><path d="M20 17H38M29 21V50M24 59H34" stroke="#243047" stroke-width="2.5"/></g></g><g id="usebundle-leftbox"><rect x="1220" y="165" width="420" height="235" rx="32" fill="none" stroke="#FF8666" stroke-width="9"/><text x="1430" y="366" font-size="39" font-weight="800" text-anchor="middle" fill="#243047">剩下2支</text></g><g id="usebundle-known"><rect x="70" y="530" width="770" height="90" rx="22" fill="#243047"/><rect x="65" y="525" width="770" height="90" rx="22" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="90" y="573" font-size="40" font-weight="500" text-anchor="start" fill="#243047">3套：3 × 3 ＝ 9元</text></g><g id="usebundle-remaining"><rect x="910" y="530" width="765" height="90" rx="22" fill="#243047"/><rect x="905" y="525" width="765" height="90" rx="22" fill="#FF8666" stroke="#243047" stroke-width="3"/><text x="930" y="573" font-size="36" font-weight="500" text-anchor="start" fill="#243047">剩下：10.6 − 9 ＝ 1.6元</text></g><g id="usebundle-why"><text x="90" y="672" font-size="35" font-weight="600" text-anchor="start" fill="#243047">先扣除已知组合的费用，剩下的钱对应剩下的商品。</text></g></svg><div class="clip subtitle" id="usebundle-sub0" data-start="0.75" data-duration="5.77" data-track-index="5">第一种买法，是三块橡皮和五支铅笔，共十点六元。</div><div class="clip subtitle" id="usebundle-sub1" data-start="6.52" data-duration="5.535" data-track-index="5">我们就在这些商品里配一配，不增加，也不拿走商品。</div><div class="clip subtitle" id="usebundle-sub2" data-start="12.626" data-duration="5.43" data-track-index="5">三块橡皮，分别配上三支铅笔，正好圈出三套。</div><div class="clip subtitle" id="usebundle-sub3" data-start="18.056" data-duration="3.415" data-track-index="5">每套三元，三套一共九元。</div><div class="clip subtitle" id="usebundle-sub4" data-start="22.03" data-duration="4.655" data-track-index="5">五支铅笔里，用了三支来配套，还剩两支。</div><div class="clip subtitle" id="usebundle-sub5" data-start="26.685" data-duration="4.176" data-track-index="5">这两支铅笔，不属于刚才圈出的三套。</div><div class="clip subtitle" id="usebundle-sub6" data-start="31.41" data-duration="4.098" data-track-index="5">十点六元里面，九元付给了三套商品。</div><div class="clip subtitle" id="usebundle-sub7" data-start="35.508" data-duration="6.268" data-track-index="5">剩下的十点六减九，等于一点六元，就是这两支铅笔的总价。</div><div class="clip subtitle" id="usebundle-sub8" data-start="42.326" data-duration="5.579" data-track-index="5">这样，我们先算出相同组合的费用，再从总价里扣除。</div><div class="clip subtitle" id="usebundle-sub9" data-start="47.905" data-duration="5.48" data-track-index="5">剩下的钱，只对应剩下的两支铅笔，问题就简单了。</div><div class="bar" id="usebundle-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#usebundle-ring0',{strokeDasharray:1800,strokeDashoffset:1800});tl.to('#usebundle-ring0',{"duration":1.2,"ease":"none","strokeDashoffset":0},13.126);gsap.set('#usebundle-price0',{"opacity":0,"y":20});tl.to('#usebundle-price0',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},14.526);gsap.set('#usebundle-ring1',{strokeDasharray:1800,strokeDashoffset:1800});tl.to('#usebundle-ring1'
