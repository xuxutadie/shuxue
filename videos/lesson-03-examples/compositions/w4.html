4978259000000005" data-track-index="5">第六次结束在十九，第七次再向前四格，到二十三。</div><div class="clip subtitle" id="w4-cap10" data-start="45.015825899999996" data-duration="5.4181741" data-track-index="5">我们停在这里，不再退一步，因为题目只要求七次。</div><div class="progress" id="w4-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#w4-op0',{"opacity":0,"y":24});tl.to('#w4-op0',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.15);gsap.set('#w4-op1',{"opacity":0,"y":24});tl.to('#w4-op1',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.38);gsap.set('#w4-op2',{"opacity":0,"y":24});tl.to('#w4-op2',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.6099999999999999);gsap.set('#w4-op3',{"opacity":0,"y":24});tl.to('#w4-op3',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.8399999999999999);gsap.set('#w4-op4',{"opacity":0,"y":24});tl.to('#w4-op4',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},2.07);gsap.set('#w4-op5',{"opacity":0,"y":24});tl.to('#w4-op5',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},2.3000000000000003);gsap.set('#w4-op6',{"opacity":0,"y":24});tl.to('#w4-op6',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},2.5300000000000002);gsap.set('#w4-group0',{"opacity":0,"y":24});tl.to('#w4-group0',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},10.006);gsap.set('#w4-group1',{"opacity":0,"y":24});tl.to('#w4-group1',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},17.802000000000003);gsap.set('#w4-group2',{"opacity":0,"y":24});tl.to('#w4-group2',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},19.202);gsap.set('#w4-left',{"opacity":0,"y":24});tl.to('#w4-left',{"duration":0.85,"
