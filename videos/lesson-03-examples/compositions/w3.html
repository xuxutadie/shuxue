l="#243047" font-size="33" font-weight="600">3组用了6次，最终前进9格</text></g></svg><div class="clip subtitle" id="w3-cap0" data-start="0.75" data-duration="3.0521738" data-track-index="5">第一组结束，棋子在十三。</div><div class="clip subtitle" id="w3-cap1" data-start="3.8021738" data-duration="2.2718262000000005" data-track-index="5">现在开始第二组。</div><div class="clip subtitle" id="w3-cap2" data-start="7.274" data-duration="4.125543400000001" data-track-index="5">第三次，十三向前走四格，到十七。</div><div class="clip subtitle" id="w3-cap3" data-start="11.3995434" data-duration="4.2255434" data-track-index="5">第四次，从十七后退一格，到十六。</div><div class="clip subtitle" id="w3-cap4" data-start="15.625086800000002" data-duration="4.148913199999999" data-track-index="5">第二组从十三到十六，也前进了三格。</div><div class="clip subtitle" id="w3-cap5" data-start="20.974" data-duration="2.0059782" data-track-index="5">第三组还是一样。</div><div class="clip subtitle" id="w3-cap6" data-start="22.979978199999998" data-duration="4.2119564" data-track-index="5">第五次，从十六前进四格，到二十。</div><div class="clip subtitle" id="w3-cap7" data-start="27.1919346" data-duration="4.1940654" data-track-index="5">第六次，从二十后退一格，到十九。</div><div class="clip subtitle" id="w3-cap8" data-start="32.586" data-duration="4.6418477000000005" data-track-index="5">请看三个组的终点：十三，十六，十九。</div><div class="clip subtitle" id="w3-cap9" data-start="37.2278477" data-duration="3.3701523" data-track-index="5">每做完一组，终点就增加三。</div><div class="clip subtitle" id="w3-cap10" data-start="41.798" data-duration="2.6038042" data-track-index="5">三组一共是六次操作。</div><div class="clip subtitle" id="w3-cap11" data-start="44.4018042" data-duration="7.688195799999999" data-track-index="5">从最初的十出发，总共前进了三个三格，也就是九格，所以现在停在十九。</div><div class="progress" id="w3-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#w3-row0',{"opacity":0,"x":-30});tl.to('#w3-row0',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.65);gsap.set('#w3-row1',{"opacity":0,"x":-30});t
