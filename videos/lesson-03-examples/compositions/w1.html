t="600">，向后退1格也算1次操作；起点10不算操作。总共操作7次，最后停在哪个数字上？</text><g id="w1-prompt"><rect x="64" y="570" width="1620" height="90" rx="20" fill="#243047"/><rect x="60" y="565" width="1620" height="90" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="90" y="624" fill="#243047" font-size="37" font-weight="600">先读完整条件，圈出已知与所求，再开始分析。</text></g></svg><div class="clip subtitle" id="w1-cap0" data-start="0.75" data-duration="3.9489129000000003" data-track-index="5">我们用走格子，把这道题的意思弄明白。</div><div class="clip subtitle" id="w1-cap1" data-start="4.698912900000001" data-duration="9.7961955" data-track-index="5">棋子从数字十出发，先向前走四格，再向后退一格，一直按这个顺序重复，总共做七次操作。</div><div class="clip subtitle" id="w1-cap2" data-start="14.495108400000001" data-duration="2.7868916000000006" data-track-index="5">最后停在哪个数字上？</div><div class="clip subtitle" id="w1-cap3" data-start="18.482000000000003" data-duration="4.8592390000000005" data-track-index="5">请特别注意，向前走四格，整段算一次操作。</div><div class="clip subtitle" id="w1-cap4" data-start="23.341239" data-duration="3.247282499999999" data-track-index="5">向后退一格，也算一次操作。</div><div class="clip subtitle" id="w1-cap5" data-start="26.5885215" data-duration="4.681478500000001" data-track-index="5">开始把棋子放在十，只是准备，不算操作。</div><div class="clip subtitle" id="w1-cap6" data-start="32.47" data-duration="3.8945651" data-track-index="5">我们先慢慢走，看看每一步发生了什么。</div><div class="clip subtitle" id="w1-cap7" data-start="36.3645651" data-duration="2.2934349000000003" data-track-index="5">先不急着列算式。</div><div class="progress" id="w1-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#w1-prompt',{"opacity":0,"x":-55});tl.to('#w1-prompt',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.65);tl.fromTo('#w1-heading',{opacity:0,x:-35},{opacity:1,x:0,duration:.6},0);tl.fromTo('#w1-progress',{scaleX:0},{scaleX:1,duration:40.583333333333336,ease:'none'},0);window.__timelines['w1']=tl;}</script></template></body></html>
