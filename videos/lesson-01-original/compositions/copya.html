="start" fill="#243047">第3份</text><text x="920" y="274" font-size="34" font-weight="600" text-anchor="start" fill="#243047">3块橡皮</text><text x="920" y="322" font-size="34" font-weight="600" text-anchor="start" fill="#243047">5支铅笔</text><text x="920" y="370" font-size="38" font-weight="800" text-anchor="start" fill="#243047">10.6元</text><circle cx="1215" cy="216" r="17" fill="#FFDB58" stroke="#243047" stroke-width="3"/></g><g id="copya-copy3"><rect x="1320" y="185" width="370" height="215" rx="22" fill="#243047"/><rect x="1315" y="180" width="370" height="215" rx="22" fill="white" stroke="#243047" stroke-width="3"/><text x="1340" y="224" font-size="30" font-weight="600" text-anchor="start" fill="#243047">第4份</text><text x="1340" y="274" font-size="34" font-weight="600" text-anchor="start" fill="#243047">3块橡皮</text><text x="1340" y="322" font-size="34" font-weight="600" text-anchor="start" fill="#243047">5支铅笔</text><text x="1340" y="370" font-size="38" font-weight="800" text-anchor="start" fill="#243047">10.6元</text><circle cx="1635" cy="216" r="17" fill="#FFDB58" stroke="#243047" stroke-width="3"/></g><g id="copya-sum"><rect x="50" y="485" width="1630" height="96" rx="22" fill="#243047"/><rect x="45" y="480" width="1630" height="96" rx="22" fill="#A8E4CA" stroke="#243047" stroke-width="3"/><text x="70" y="528" font-size="37" font-weight="500" text-anchor="start" fill="#243047">3×4＝12块橡皮　5×4＝20支铅笔　10.6×4＝42.4元</text></g><g id="copya-rule"><text x="75" y="654" font-size="39" font-weight="800" text-anchor="start" fill="#243047">整单×4：商品数量与总价一起扩大。</text></g></svg><div class="source">依据：第十四届小学“希望杯”五年级第2试第2题</div><div class="clip subtitle" id="copya-sub0" data-start="0.75" data-duration="6.286" data-track-index="5">一份第一张订单，是三块橡皮、五支铅笔，总价十点六元。</div><div class="clip subtitle" id="copya-sub1" data-start="7.036" data-duration="3.076" data-track-index="5">现在按这张订单买四份。</div><div class="clip subtitle" id="copya-sub2" data-start="10.682" data-duration="3.351" data-track-index="5">请看，复制的是整张购物单。</div><div class="clip subtitle" id="copya-sub3" data-start="14.033" data-duration="6.73" data-track-index="5">每多一份，就同时多三块橡皮、五支铅笔，也多付十点六元。</div><div class="clip subtitle" id="copya-sub4" data-start="21.334" data-duration="6.64" data-track-index="5">四份合起来：十二块橡皮，二十支铅笔，总价四十二点四元。</div><div class="clip subtitle" id="copya-sub5" data-start="28.482" data-duration="5.362" data-track-index="5">这就是为什么两种商品的数量和总价，都必须乘四。</div><div class="clip subtitle" id="copya-sub6" data-start="33.844" data-duration="7.07" data-track-index="5">只把铅笔乘四，却不改橡皮和总价，就不是原来条件告诉我们的购买了。</div><div class="bar" id="copya-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#copya-copy0',{"opacity":0,"x":-5,"y":-160});tl.to('#copya-copy0',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},10.932);tl.to('#copya-copy0',{"duration":0.8,"ease":"power2.inOut","y":40,"scale":0.96,"transformOrigin":"50% 50%"},21.234);gsap.set('#copya-copy1',{"opacity":0,"x":-425,"y":-160});tl.to('#copya-copy1',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},11.782);tl.to('#copya-copy1',{"duration":0.8,"ease":"power2.inOut","y":40,"scale":0.96,"transformOrigin":"50% 50%"},21.364);gsap.set('#copya-copy2',{"opacity":0,"x":-845,"y":-160});tl.to('#copya-copy2',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},12.632);tl.to('#copya-copy2',{"duration":0.8,"ease":"power2.inOut","y":40,"scale":0.96,"transformOrigin":"50% 50%"},21.494);gsap.set('#copya-copy3',{"opacity":0,"x":-1265,"y":-160});tl.to('#copya-copy3',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},13.482);tl.to('#copya-copy3',{"duration":0.8,"ease":"power2.inOut","y":40,"scale":0.96,"transformOrigin":"50% 50%"},21.624);gsap.set('#copya-sum',{"opacity":0,"y":90});tl.to('#copya-sum',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},22.234);gsap.set('#copya-rule',{"opacity":0,"y":20});tl.to('#copya-rule',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},28.382);tl.fromTo('
