 aria-label="16元属于4个杯子，不是1个"><g id="share-total"><rect x="425" y="20" width="920" height="100" rx="22" fill="#243047"/><rect x="420" y="15" width="920" height="100" rx="22" fill="#FFDB58" stroke="#243047" stroke-width="3"/><text x="445" y="63" font-size="46" font-weight="500" text-anchor="start" fill="#243047">4个茶杯的总价：16元</text></g><g id="share-cup0"><g transform="translate(250 230) scale(1.8)"><path d="M9 18H42V54Q42 65 25 65Q9 65 9 54Z" fill="#FF9B77" stroke="#243047" stroke-width="3"/><path d="M43 26H49Q60 27 55 40Q52 45 43 44" fill="none" stroke="#243047" stroke-width="4"/><path d="M16 26V50" stroke="white" stroke-width="4" stroke-linecap="round"/></g></g><g id="share-coin0"><rect x="205" y="395" width="190" height="80" rx="22" fill="#243047"/><rect x="200" y="390" width="190" height="80" rx="22" fill="#FFDB58" stroke="#243047" stroke-width="3"/><text x="295" y="446" font-size="42" font-weight="800" text-anchor="middle" fill="#243047">4元</text></g><g id="share-arrow0"><path d="M875 127L293 225" stroke="#243047" stroke-width="4" fill="none"/></g><g id="share-cup1"><g transform="translate(615 230) scale(1.8)"><path d="M9 18H42V54Q42 65 25 65Q9 65 9 54Z" fill="#FF9B77" stroke="#243047" stroke-width="3"/><path d="M43 26H49Q60 27 55 40Q52 45 43 44" fill="none" stroke="#243047" stroke-width="4"/><path d="M16 26V50" stroke="white" stroke-width="4" stroke-linecap="round"/></g></g><g id="share-coin1"><rect x="570" y="395" width="190" height="80" rx="22" fill="#243047"/><rect x="565" y="390" width="190" height="80" rx="22" fill="#FFDB58" stroke="#243047" stroke-width="3"/><text x="660" y="446" font-size="42" font-weight="800" text-anchor="middle" fill="#243047">4元</text></g><g id="share-arrow1"><path d="M875 127L658 225" stroke="#243047" stroke-width="4" fill="none"/></g><g id="share-cup2"><g transform="translate(980 230) scale(1.8)"><path d="M9 18H42V54Q42 65 25 65Q9 65 9 54Z" fill="#FF9B77" stroke="#243047" stroke-width="3"/><path d="M43 26H49Q60 27 55 40Q52 45 43 44" fill="none" stroke="#243047" stroke-width="4"/><path d="M16 26V50" stroke="white" stroke-width="4" stroke-linecap="round"/></g></g><g id="share-coin2"><rect x="935" y="395" width="190" height="80" rx="22" fill="#243047"/><rect x="930" y="390" width="190" height="80" rx="22" fill="#FFDB58" stroke="#243047" stroke-width="3"/><text x="1025" y="446" font-size="42" font-weight="800" text-anchor="middle" fill="#243047">4元</text></g><g id="share-arrow2"><path d="M875 127L1023 225" stroke="#243047" stroke-width="4" fill="none"/></g><g id="share-cup3"><g transform="translate(1345 230) scale(1.8)"><path d="M9 18H42V54Q42 65 25 65Q9 65 9 54Z" fill="#FF9B77" stroke="#243047" stroke-width="3"/><path d="M43 26H49Q60 27 55 40Q52 45 43 44" fill="none" stroke="#243047" stroke-width="4"/><path d="M16 26V50" stroke="white" stroke-width="4" stroke-linecap="round"/></g></g><g id="share-coin3"><rect x="1300" y="395" width="190" height="80" rx="22" fill="#243047"/><rect x="1295" y="390" width="190" height="80" rx="22" fill="#FFDB58" stroke="#243047" stroke-width="3"/><text x="1390" y="446" font-size="42" font-weight="800" text-anchor="middle" fill="#243047">4元</text></g><g id="share-arrow3"><path d="M875 127L1388 225" stroke="#243047" stroke-width="4" fill="none"/></g><g id="share-formula"><rect x="65" y="515" width="1610" height="88" rx="22" fill="#243047"/><rect x="60" y="510" width="1610" height="88" rx="22" fill="#75C9FF" stroke="#243047" stroke-width="3"/><text x="85" y="558" font-size="42" font-weight="500" text-anchor="start" fill="#243047">(134 − 118) ÷ (20 − 16) ＝ 16 ÷ 4 ＝ 4元</text></g><g id="share-reason"><text x="80" y="652" font-size="37" font-weight="600" text-anchor="start" fill="#243047">先确认：金额差只对应一种商品的数量差。</text></g></svg><div class="source">依据：《中科数学思维训练·五年级》第一讲例1</div><div class="clip subtitle" id="share-sub0" data-start="0.75" data-duration="4.03" data-track-index="5">这十六元，是四个茶杯合起来的价格。</div><div class="clip subtitle" id="share-sub1" data-start="4.78" data-duration="3.999" data-track-index="5">我们还不能说，一个茶杯就是十六元。</div><div class="clip subtitle" id="share-sub2" data-start="9.338" data-duration="3.609" data-track-index="5">四个同样的茶杯，每个价格相同。</div><div class="clip subtitle" id="share-sub3" data-start="12.947" data-duration="6.268" data-track-index="5">把十六元平均分成四份，每份四元，才是一个茶杯的价格。</div><div class="clip subtitle" id="share-sub4" data-start="19.774" data-duration="8.772" data-track-index="5">把刚才的图写成算式：价钱差，一百三十四减一百一十八；数量差，二十减十六。</div><div class="clip subtitle" id="share-sub5" data-start="28.546" data-duration="4.937" data-track-index="5">用价钱差除以数量差，得到每个茶杯四元。</div><div class="clip subtitle" id="share-sub6" data-start="34.05" data-duration="7.359" data-track-index="5">做这一步以前，一定要先确认：价钱的差，是否只对应一种商品的数量差。</div><div class="clip subtitle" id="share-sub7" data-start="41.409" data-duration="4.747" data-track-index="5">刚才我们先消去了相同费用，所以可以这样算。</div><div class="bar" id="share-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#share-arrow0',{strokeDasharray:1800,strokeDashoffset:1800});tl.to('#share-arrow0',{"duration":1.2,"ease":"none","strokeDashoffset":0},9.238);gsap.set('#share-coin0',{"opacity":0,"x":600,"y":-240});tl.to('#share-coin0',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},11.238);tl.to('#share-cup0',{"duration":0.45,"ease":"power2.inOut","scale":1.07,"transformOrigin":"50% 50%","yoyo":true,"repeat":1},11.238);gsap.set('#share-arrow1',{strokeDasharray:1800,strokeDashoffset:1800});tl.to('#share-arrow1',{"duration":1.2,"ease":"none","strokeDashoffset":0},9.838);gsap.set('#share-coin1',{"opacity":0,"x":235,"y":-240});tl.to('#share-coin1',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},11.938);tl.to('#share-cup1',{"duration":0.45,"ease":"power2.inOut","scale":1.07,"transformOrigin":"50% 50%","yoyo":true,"repeat":1},11.938);gsap.set('#share-arrow2',{strokeDasharray:1800,strokeDashoffset:1800});tl.to('#share-arrow2',{"duration":1.2,"ease":"none","strokeDashoffset":0},10.438);gsap.set('#share-coi
