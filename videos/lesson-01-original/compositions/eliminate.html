title" id="eliminate-sub1" data-start="7.082" data-duration="2.631" data-track-index="5">橡皮也有相同的部分。</div><div class="clip subtitle" id="eliminate-sub2" data-start="9.713" data-duration="5.29" data-track-index="5">两边共有的十二块配对后，第二组还多八块橡皮。</div><div class="clip subtitle" id="eliminate-sub3" data-start="15.574" data-duration="6.014" data-track-index="5">第二组比第一组多付六十减四十二点四，等于十七点六元。</div><div class="clip subtitle" id="eliminate-sub4" data-start="21.588" data-duration="4.801" data-track-index="5">这次，多付的钱只对应多出的八块橡皮。</div><div class="clip subtitle" id="eliminate-sub5" data-start="26.946" data-duration="3.677" data-track-index="5">十七点六除以八，等于二点二元。</div><div class="clip subtitle" id="eliminate-sub6" data-start="30.623" data-duration="4.095" data-track-index="5">所以，一块橡皮的价格是二点二元。</div><div class="clip subtitle" id="eliminate-sub7" data-start="35.27" data-duration="10.489" data-track-index="5">回想一下，同样是相减，刚才直接减不行；现在先把铅笔配成相同数量，相减就能只留下橡皮了。</div><div class="bar" id="eliminate-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});tl.to('#eliminate-p0-0',{"duration":0.8,"ease":"power2.inOut","opacity":0.13},1.65);tl.to('#eliminate-p1-0',{"duration":0.8,"ease":"power2.inOut","opacity":0.13},1.65);tl.to('#eliminate-p0-1',{"duration":0.8,"ease":"power2.inOut","opacity":0.13},1.76);tl.to('#eliminate-p1-1',{"duration":0.8,"ease":"power2.inOut","opacity":0.13},1.76);tl.to('#eliminate-p0-2',{"duration":0.8,"ease":"power2.inOut","opacity":0.13},1.87);tl.to('#eliminate-p1-2',{"duration":0.8,"ease":"power2.inOut","opacity":0.13},1.87);tl.to('#eliminate-p0-3',{"duration":0.8,"ease":"power2.inOut","opacity":0.13},1.98);tl.to('#eliminate-p1-3',{"duration":0.8,"ease":"power2.inOut","opacity":0.13},1.98);tl.to('#eliminate-p0-4',{"duration":0.8,"ease":"power2.inOut","opacity":0.13},2.09);tl.to('#eliminate-p1-4',{"duration":0.8,"ease":"power2.inOut","opacity":0.13},2.09);tl.to('#eliminate-p0-5',{"duration":0.8,"ease":"power2.inOut","opacity":0.13},2.2);tl.to('#eliminate-p1-5',{"durati
