：完整解决一道新题</h1><svg class="board" viewBox="0 0 1760 680" role="img" aria-label="换你来讲：完整解决一道新题"><rect x="30" y="20" width="1690" height="435" rx="22" fill="#243047"/><rect x="25" y="15" width="1690" height="435" rx="22" fill="white" stroke="#243047" stroke-width="3"/><text x="70" y="90" font-size="40" font-weight="500" text-anchor="start" fill="#243047">小宁准备给学习小组购买文具。买5块橡皮和3支铅笔</text><text x="70" y="166" font-size="40" font-weight="500" text-anchor="start" fill="#243047">需要14.9元；如果改买同品种的3块橡皮和5支铅笔，</text><text x="70" y="242" font-size="40" font-weight="500" text-anchor="start" fill="#243047">需要13.1元。商品单价保持不变，购买时没有折扣。</text><text x="70" y="318" font-size="40" font-weight="500" text-anchor="start" fill="#243047">一块橡皮和一支铅笔的价格各是多少元？</text><text x="70" y="394" font-size="40" font-weight="500" text-anchor="start" fill="#243047">请写出计算过程，并说明自己的方法为什么成立。</text><g id="challenge-prepare"><rect x="75" y="508" width="1600" height="125" rx="22" fill="#243047"/><rect x="70" y="503" width="1600" height="125" rx="22" fill="#A8E4CA" stroke="#243047" stroke-width="3"/><text x="95" y="551" font-size="36" font-weight="500" text-anchor="start" fill="#243047">暂停视频，用草稿纸画图、计算。</text><text x="95" y="603" font-size="36" font-weight="500" text-anchor="start" fill="#243047">准备好以后，上台讲清思路，并检验两组条件。</text></g></svg><div class="source">同类原创变式 · 独立讲解</div><div class="clip subtitle" id="challenge-sub0" data-start="0.75" data-duration="2.699" data-track-index="5">现在，换你当小老师。</div><div class="clip subtitle" id="challenge-sub1" data-start="3.449" data-duration="4.135" data-track-index="5">这是一道同类的新题，请先完整阅读。</div><div class="clip subtitle" id="challenge-sub2" data-start="8.138" data-duration="3.501" data-track-index="5">小宁准备给学习小组购买文具。</div><div class="clip subtitle" id="challenge-sub3" data-start="11.639" data-duration="4.787" data-track-index="5">买五块橡皮和三支铅笔需要十四点九元。</div><div class="clip subtitle" id="challenge-sub4" data-start="16.99" data-duration="6.164" data-track-index="5">如果改买同品种的三块橡皮和五支铅笔，需要十三点一元。</div><div class="clip subtitle" id="challenge-sub5" data-start="23.154" data-duration="4.448" data-track-index="5">商品单价保持不变，购买时没有折扣。</div><div class="clip subtitle" id="challenge-sub6" data-start="28.17" data-duration="4.56" data-track-index="5">一块橡皮和一支铅笔的价格各是多少元？</div><div class="clip subtitle" id="challenge-sub7" data-start="32.73" data-duration="5.263" data-track-index="5">请写出计算过程，并说明自己的方法为什么成立。</div><div class="clip subtitle" id="challenge-sub8" data-start="38.558" data-duration="4.221" data-track-index="5">暂停视频，可以用草稿纸画图和计算。</div><div class="clip subtitle" id="challenge-sub9" data-start="42.779" data-duration="6.73" data-track-index="5">准备好以后，上台讲清你的思路，并用原题的两组条件检查答案。</div><div class="bar" id="challenge-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});tl.fromTo('#challenge-heading',{x:-35,opacity:0},{x:0,opacity:1,duration:.6,ease:'power3.out'},0);tl.fromTo('#challenge-progress',{scaleX:0},{scaleX:1,duration:60.674,ease:'none'},0);window.__timelines['challenge']=tl;}</script></template></body></html>
