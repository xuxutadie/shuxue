g class="board" viewBox="0 0 1760 680" role="img" aria-label="把答案放回原来的两次购买"><g id="verify-eraserprice"><rect x="35" y="20" width="785" height="100" rx="22" fill="#243047"/><rect x="30" y="15" width="785" height="100" rx="22" fill="#C6B1FF" stroke="#243047" stroke-width="3"/><text x="55" y="63" font-size="43" font-weight="500" text-anchor="start" fill="#243047">橡皮：每块2.2元</text></g><g id="verify-pencilprice"><rect x="920" y="20" width="790" height="100" rx="22" fill="#243047"/><rect x="915" y="15" width="790" height="100" rx="22" fill="#FFDB58" stroke="#243047" stroke-width="3"/><text x="945" y="79" font-size="43" font-weight="600" text-anchor="start" fill="#243047">铅笔：每支0.8元</text></g><g id="verify-pencilcalc"><rect x="50" y="169" width="1640" height="93" rx="22" fill="#243047"/><rect x="45" y="164" width="1640" height="93" rx="22" fill="#75C9FF" stroke="#243047" stroke-width="3"/><text x="70" y="212" font-size="42" font-weight="500" text-anchor="start" fill="#243047">(12 − 4 × 2.2) ÷ 4 ＝ 0.8元</text></g><g id="verify-first"><rect x="50" y="307" width="1640" height="90" rx="22" fill="#243047"/><rect x="45" y="302" width="1640" height="90" rx="22" fill="#A8E4CA" stroke="#243047" stroke-width="3"/><text x="70" y="350" font-size="40" font-weight="500" text-anchor="start" fill="#243047">第一次：3 × 2.2 ＋ 5 × 0.8 ＝ 10.6元  ✓</text></g><g id="verify-second"><rect x="50" y="437" width="1640" height="90" rx="22" fill="#243047"/><rect x="45" y="432" width="1640" height="90" rx="22" fill="#A8E4CA" stroke="#243047" stroke-width="3"/><text x="70" y="480" font-size="40" font-weight="500" text-anchor="start" fill="#243047">第二次：4 × 2.2 ＋ 4 × 0.8 ＝ 12元  ✓</text></g><g id="verify-summary"><text x="90" y="635" font-size="40" font-weight="800" text-anchor="start" fill="#243047">整理条件 → 创造相同 → 消去求解 → 代回检验</text></g></svg><div class="source">依据：第十四届小学“希望杯”五年级第2试第2题</div><div class="clip subtitle" id="verify-sub0" data-start="0.75" data-duration="2.237" data-track-index="5">检验要回到原题。</div><div class="clip subtitle" id="verify-sub1" data-start="2.987" data-duration="4.543" data-track-index="5">一块橡皮二点二元，四块共八点八元。</div><div class="clip subtitle" id="verify-sub2" data-start="8.09" data-duration="9.33" data-track-index="5">第二次总价十二元，减八点八元，剩三点二元买四支铅笔，所以每支铅笔零点八元。</div><div class="clip subtitle" id="verify-sub3" data-start="17.926" data-duration="8.27" data-track-index="5">检验第一次：三块橡皮六点六元，五支铅笔四元，总价十点六元，符合。</div><div class="clip subtitle" id="verify-sub4" data-start="26.706" data-duration="8.827" data-track-index="5">检验第二次：四块橡皮八点八元，四支铅笔三点二元，总价十二元，也符合。</div><div class="clip subtitle" id="verify-sub5" data-start="36.038" data-duration="7.02" data-track-index="5">消去法的关键，是先让一种未知商品的总价相同，再比较剩下的部分。</div><div class="clip subtitle" id="verify-sub6" data-start="43.058" data-duration="3.995" data-track-index="5">数量不相同，就先把条件整体扩大。</div><div class="clip subtitle" id="verify-sub7" data-start="47.052" data-duration="3.442" data-track-index="5">最后求单价，代回原题检验。</div><div class="bar" id="verify-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#verify-pencilprice',{"opacity":0,"y":20});tl.to('#verify-pencilprice',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},11.99);gsap.set('#verify-pencilcalc',{"opacity":0,"y":20});tl.to('#verify-pencilcalc',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},8.99);gsap.set('#verify-first',{"opacity":0,"x":-90});tl.to('#verify-first',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},19.826);gsap.set('#verify-second',{"opacity":0,"x":90});tl.to('#verify-second',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},28.606);gsap.set('#verify-summary',{"opacity":0,"y":20});tl.to('#verify-summary',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},35.938);tl.fromTo('#verify-heading',{x:-35,opacity:0},{x:0,opacity:1,duration:.6,ease:'power3.out'},0);tl.fromTo('#verify-progress',{scaleX:0},{scaleX:1,duration:51.658,ease:'none'},0);window.__timelines['verify']=tl;}</script></te
