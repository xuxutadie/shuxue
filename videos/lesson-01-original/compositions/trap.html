ansform="translate(1442 110) scale(1)"><path d="M20 10Q20 4 29 4Q38 4 38 10V51L29 68L20 51Z" fill="#FFDB58" stroke="#243047" stroke-width="3"/><path d="M20 17H38M29 21V50M24 59H34" stroke="#243047" stroke-width="2.5"/></g></g><g id="trap-pb3"><g transform="translate(1518 110) scale(1)"><path d="M20 10Q20 4 29 4Q38 4 38 10V51L29 68L20 51Z" fill="#FFDB58" stroke="#243047" stroke-width="3"/><path d="M20 17H38M29 21V50M24 59H34" stroke="#243047" stroke-width="2.5"/></g></g><g id="trap-diff"><rect x="265" y="315" width="1200" height="93" rx="22" fill="#243047"/><rect x="260" y="310" width="1200" height="93" rx="22" fill="#FFDB58" stroke="#243047" stroke-width="3"/><text x="285" y="358" font-size="47" font-weight="500" text-anchor="start" fill="#243047">12 − 10.6 ＝ 1.4元</text></g><g id="trap-new-eraser"><rect x="65" y="450" width="720" height="107" rx="22" fill="#243047"/><rect x="60" y="445" width="720" height="107" rx="22" fill="#C6B1FF" stroke="#243047" stroke-width="3"/><text x="90" y="512" font-size="39" font-weight="600" text-anchor="start" fill="#243047">多买1块橡皮：多付钱</text></g><g id="trap-less-pencil"><rect x="965" y="450" width="720" height="107" rx="22" fill="#243047"/><rect x="960" y="445" width="720" height="107" rx="22" fill="#75C9FF" stroke="#243047" stroke-width="3"/><text x="990" y="512" font-size="39" font-weight="600" text-anchor="start" fill="#243047">少买1支铅笔：少付钱</text></g><g id="trap-note"><text x="125" y="636" font-size="41" font-weight="800" text-anchor="start" fill="#243047">差额包含两种变化，不能直接当成橡皮单价。</text></g></svg><div class="source">依据：第十四届小学“希望杯”五年级第2试第2题</div><div class="clip subtitle" id="trap-sub0" data-start="0.75" data-duration="3.541" data-track-index="5">十二元比十点六元多一点四元。</div><div class="clip subtitle" id="trap-sub1" data-start="4.291" data-duration="5.317" data-track-index="5">能把这多出的一点四元，直接当成一块橡皮的价格吗？</div><div class="clip subtitle" id="trap-sub2" data-start="10.178" data-duration="5.852" data-track-index="5">先看橡皮：第二次多买了一块，需要多付这块橡皮的钱。</div><div class="clip subtitle" id="trap-sub3" data-start="16.534" data-duration="5.797" data-track-index="5">但是，第二次也少买了一支铅笔，会少付这支铅笔的钱。</div><div class="clip subtitle" id="trap-sub4" data-start="22.331" data-duration="3.877" data-track-index="5">多买与少买，两个变化同时发生。</div><div class="clip subtitle" id="trap-sub5" data-start="26.778" data-duration="6.598" data-track-index="5">所以，一点四元是多买一块橡皮、又少买一支铅笔之后的差额。</div><div class="clip subtitle" id="trap-sub6" data-start="33.376" data-duration="2.826" data-track-index="5">还没有哪一种商品被抵消。</div><div class="clip subtitle" id="trap-sub7" data-start="36.202" data-duration="3.565" data-track-index="5">我们需要先创造数量相同的部分。</div><div class="bar" id="trap-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#trap-diff',{"opacity":0,"y":20});tl.to('#trap-diff',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},1.65);gsap.set('#trap-new-eraser',{"opacity":0,"x":-130});tl.to('#trap-new-eraser',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},11.078);tl.to('#trap-eb3',{"duration":0.45,"ease":"power2.inOut","scale":1.07,"transformOrigin":"50% 50%","yoyo":true,"repeat":1},11.078);gsap.set('#trap-less-pencil',{"opacity":0,"x":130});tl.to('#trap-less-pencil',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},17.434);tl.to('#trap-pa4',{"duration":0.8,"ease":"power2.inOut","y":70,"opacity":0.2},17.434);gsap.set('#trap-note',{"opacity":0,"y":20});tl.to('#trap-note',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},26.678);tl.fromTo('#trap-heading',{x:-35,opacity:0},{x:0,opacity:1,duration:.6,ease:'power3.out'},0);tl.fromTo('#trap-progress',{scaleX:0},{scaleX:1,duration:40.934,ease:'none'},0);window.__timelines['trap']=tl;}</script></template></body></html>
