 680" role="img" aria-label="比赛原题：两种数量都变了"><rect x="25" y="17" width="1700" height="270" rx="22" fill="#243047"/><rect x="20" y="12" width="1700" height="270" rx="22" fill="white" stroke="#243047" stroke-width="3"/><text x="60" y="73" font-size="42" font-weight="500" text-anchor="start" fill="#243047">小磊买3块橡皮，5支铅笔需付10.6元。若他买同品种的</text><text x="60" y="149" font-size="42" font-weight="500" text-anchor="start" fill="#243047">4块橡皮，4支铅笔需付12元，则一块橡皮的价格是</text><text x="60" y="225" font-size="42" font-weight="500" text-anchor="start" fill="#243047">________元。</text><g id="contest-underline1"><path d="M245 88H1050" stroke="#FFDB58" stroke-width="9" stroke-linecap="round"/></g><g id="contest-underline2"><path d="M70 164H1270" stroke="#75C9FF" stroke-width="9" stroke-linecap="round"/></g><g id="contest-order1"><rect x="45" y="332" width="1640" height="105" rx="22" fill="#243047"/><rect x="40" y="327" width="1640" height="105" rx="22" fill="#FFDB58" stroke="#243047" stroke-width="3"/><text x="65" y="375" font-size="42" font-weight="500" text-anchor="start" fill="#243047">第一次：3块橡皮 ＋ 5支铅笔 ＝ 10.6元</text></g><g id="contest-order2"><rect x="45" y="475" width="1640" height="105" rx="22" fill="#243047"/><rect x="40" y="470" width="1640" height="105" rx="22" fill="#75C9FF" stroke="#243047" stroke-width="3"/><text x="65" y="518" font-size="42" font-weight="500" text-anchor="start" fill="#243047">第二次：4块橡皮 ＋ 4支铅笔 ＝ 12元</text></g><g id="contest-note"><text x="65" y="647" font-size="34" font-weight="600" text-anchor="start" fill="#243047">两种数量都变了：还不能直接抵消。</text></g></svg><div class="source">依据：第十四届小学“希望杯”五年级第2试第2题</div><div class="clip subtitle" id="contest-sub0" data-start="0.75" data-duration="6.789" data-track-index="5">再看你提供的比赛试卷，第十四届希望杯，五年级第二试的第二题。</div><div class="clip subtitle" id="contest-sub1" data-start="7.539" data-duration="1.975" data-track-index="5">请完整读题。</div><div class="clip subtitle" id="contest-sub2" data-start="10.082" data-duration="5.186" data-track-index="5">小磊买三块橡皮，五支铅笔需付十点六元。</div><div class="clip subtitle" id="contest-sub3" data-start="15.766" data-duration="8.365" data-track-index="5">若他买同品种的四块橡皮，四支铅笔需付十二元，则一块橡皮的价格是多少元？</div><div class="clip subtitle" id="contest-sub4" data-start="24.642" data-duration="6.34" data-track-index="5">这一题，橡皮从三块变成四块，铅笔却从五支变成四支。</div><div class="clip subtitle" id="contest-sub5" data-start="30.982" data-duration="2.636" data-track-index="5">两种商品的数量都不同。</div><div class="clip subtitle" id="contest-sub6" data-start="33.618" data-duration="4.638" data-track-index="5">原来直接消去的条件，这次没有现成地出现。</div><div class="bar" id="contest-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#contest-underline1',{strokeDasharray:1800,strokeDashoffset:1800});tl.to('#contest-underline1',{"duration":1.2,"ease":"none","strokeDashoffset":0},9.982);gsap.set('#contest-underline2',{strokeDasharray:1800,strokeDashoffset:1800});tl.to('#contest-underline2',{"duration":1.2,"ease":"none","strokeDashoffset":0},15.666);gsap.set('#contest-order1',{"opacity":0,"x":-150});tl.to('#contest-order1',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},11.982);gsap.set('#contest-order2',{"opacity":0,"x":150});tl.to('#contest-order2',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},18.666);gsap.set('#contest-note',{"opacity":0,"y":20});tl.to('#contest-note',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},24.542);tl.fromTo('#contest-heading',{x:-35,opacity:0},{x:0,opacity:1,duration:.6,ease:'power3.out'},0);tl.fromTo('#contest-progress',{scaleX:0},{scaleX:1,duration:39.422,ease:'none'},0);window.__timelines['contest']=tl;}</script></template></body></html>
