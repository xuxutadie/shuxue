 x="70" y="528" font-size="37" font-weight="500" text-anchor="start" fill="#243047">4×5＝20块橡皮　4×5＝20支铅笔　12×5＝60元</text></g><g id="copyb-rule"><text x="75" y="654" font-size="39" font-weight="800" text-anchor="start" fill="#243047">两组都有20支同品种铅笔，费用相同。</text></g></svg><div class="source">依据：第十四届小学“希望杯”五年级第2试第2题</div><div class="clip subtitle" id="copyb-sub0" data-start="0.75" data-duration="6.109" data-track-index="5">第二张订单，一份是四块橡皮、四支铅笔，总价十二元。</div><div class="clip subtitle" id="copyb-sub1" data-start="6.859" data-duration="1.853" data-track-index="5">我们需要五份。</div><div class="clip subtitle" id="copyb-sub2" data-start="9.266" data-duration="3.31" data-track-index="5">把相同的整张订单复制五份。</div><div class="clip subtitle" id="copyb-sub3" data-start="12.576" data-duration="5.888" data-track-index="5">每份都有橡皮、铅笔和对应的价钱，三项一起增加。</div><div class="clip subtitle" id="copyb-sub4" data-start="19.03" data-duration="5.661" data-track-index="5">合起来，是二十块橡皮、二十支铅笔，总价六十元。</div><div class="clip subtitle" id="copyb-sub5" data-start="25.194" data-duration="5.457" data-track-index="5">现在，第一组和第二组都买了二十支同品种的铅笔。</div><div class="clip subtitle" id="copyb-sub6" data-start="30.651" data-duration="6.282" data-track-index="5">我们不知道每支铅笔多少钱，也能确定，这部分费用相同。</div><div class="bar" id="copyb-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#copyb-copy0',{"opacity":0,"x":-5,"y":-160});tl.to('#copyb-copy0',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},9.516);tl.to('#copyb-copy0',{"duration":0.8,"ease":"power2.inOut","y":40,"scale":0.96,"transformOrigin":"50% 50%"},18.93);gsap.set('#copyb-copy1',{"opacity":0,"x":-340,"y":-160});tl.to('#copyb-copy1',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},10.366);tl.to('#copyb-copy1',{"duration":0.8,"ease":"power2.inOut","y":40,"scale":0.96,"transformOrigin":"50% 50%"},19.06);gsap.set('#copyb-copy2',{"opacity":0,"x":-675,"y":-160});tl.to('#copyb-copy2',{"duration":0.7,"ease":"power2.out","opacity":1,"x":0,"y":0},11.21
