#solve{position:absolute;inset:0;width:1920px;height:1080px}</style><div id="solve" data-composition-id="solve" data-width="1920" data-height="1080" data-duration="48.68"><div class="scene"><div class="header"><span class="badge">03 / 求解</span><span class="brand">思维实验室 · 消去问题</span></div><h1 id="solve-title">先求笔价，再求本子价</h1><div class="body"><div class="small-condition">小明：2本本子 ＋ 3支笔 = 13元　｜　小红：2本本子 ＋ 5支笔 = 17元</div><div class="equation reveal white" id="solve-difference">多付 17 − 13 = 4（元）　多出 5 − 3 = 2（支）</div><div class="equation reveal yellow" id="solve-penprice">每支笔：4 ÷ 2 = <strong>2（元）</strong></div><div class="equation reveal white" id="solve-pencost">3支笔总价：3 × 2 = 6（元）</div><div class="equation reveal white" id="solve-bookcost">2本本子总价：13 − 6 = 7（元）</div><div class="equation reveal blue" id="solve-bookprice">每本本子：7 ÷ 2 = <strong>3.5（元）</strong></div><div class="tip reveal" id="solve-summary">先求一种单价 → 再代回原条件</div></div><div class="clip subtitle" id="solve-sub-0" data-start="0.7" data-duration="4.071" data-track-index="5">多付的钱是十七减十三，等于四元。</div>
<div class="clip subtitle" id="solve-sub-1" data-start="4.771" data-duration="3.517" data-track-index="5">多出的笔是五减三，等于两支。</div>
<div class="clip subtitle" id="solve-sub-2" data-start="8.682" data-duration="6.422" data-track-index="5">注意，四元是两支笔的总价，还要除以二，才是一支笔的价格。</div>
<div class="clip subtitle" id="solve-sub-3" data-start="15.104" data-duration="2.865" data-track-index="5">四除以二，等于两元。</div>
<div class="clip subtitle" id="solve-sub-4" data-start="18.368" data-duration="2.087" data-track-index="5">再看小明的订单。</div>
<div class="clip subtitle" id="solve-sub-5" data-start="20.455" data-duration="4.047" data-track-index="5">三支笔，每支两元，一共是六元。</div>
<div class="clip subtitle" id="solve-sub-6" data-start="24.886" data-duration="5.899" data-track-index="5">十三元减去笔的六元，剩下七元，是两本本子的总价。</div>
<div class="clip subtitle" id="solve-sub-7" data-start="31.116" data-duration="2.74" data-track-index="5">七除以二，等于三点五。</div>
<div class="clip subtitle" id="solve-sub-8" data-start="33.856" data-duration="5.12" data-track-index="5">因此，每本本子三点五元，也就是三元五角。</div>
<div class="clip subtitle" id="solve-sub-9" data-start="39.362" data-duration="7.38" data-track-index="5">记住这个顺序：先比较差，求一种单价，再代回原题，求另一种单价。</div><div class="progress" id="solve-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});tl.fromTo('#solve-title',{opacity:0,x:-25},{opacity:1,x:0,duration:.5,ease:'power3.out'},0);tl.fromTo('#solve-difference',{opacity:0,y:16},{opacity:1,y:0,duration:.45,ease:'power2.out'},0.6);tl.fromTo('#solve-penprice',{opacity:0,y:16},{opacity:1,y:0,duration:.45,ease:'power2.out'},8.582);tl.fromTo('#solve-pencost',{opacity:0,y:16},{opacity:1,y:0,duration:.45,ease:'power2.out'},18.268);tl.fromTo('#solve-bookcost',{opacity:0,y:16},{opacity:1,y:0,duration:.45,ease:'power2.out'},24.786);tl.fromTo('#solve-bookprice',{opacity:0,y:16},{opacity:1,y:0,duration:.45,ease:'power2.out'},31.016);tl.fromTo('#solve-summary',{opacity:0,y:16},{opacity:1,y:0,duration:.45,ease:'power2.out'},39.262);tl.fromTo('#solve-progress',{scaleX:0},{scaleX:1,duration:48.68,ease:'none'},0);window.__timelines['solve']=tl;}</script></template></body></html>
