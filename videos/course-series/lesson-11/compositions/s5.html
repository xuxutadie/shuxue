" stroke="#243047" stroke-width="3"/><text x="78" y="186" fill="#243047" font-size="32" font-weight="600">找错因</text></g><g id="s5-step1"><rect x="529" y="105" width="380" height="150" rx="20" fill="#243047"/><rect x="525" y="100" width="380" height="150" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="543" y="186" fill="#243047" font-size="32" font-weight="600">补方法</text></g><g id="s5-step2"><rect x="64" y="350" width="380" height="150" rx="20" fill="#243047"/><rect x="60" y="345" width="380" height="150" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="78" y="431" fill="#243047" font-size="32" font-weight="600">自己讲</text></g><g id="s5-step3"><rect x="529" y="350" width="380" height="150" rx="20" fill="#243047"/><rect x="525" y="345" width="380" height="150" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="543" y="431" fill="#243047" font-size="32" font-weight="600">用新题验</text></g><g id="s5-arrow"><path d="M440 175H505M705 260V325M510 420H440" stroke="#243047" stroke-width="5" fill="none"/></g><g id="s5-note0"><rect x="1044" y="40" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="35" width="680" height="125" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="1065" y="84" fill="#243047" font-size="33" font-weight="600">找：第一处出错的位置</text></g><g id="s5-note1"><rect x="1044" y="193" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="188" width="680" height="125" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="1065" y="237" fill="#243047" font-size="33" font-weight="600">补：回到对应知识点</text></g><g id="s5-note2"><rect x="1044" y="346" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="341" width="680" height="125" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="1065" y="390" fill="#243047" font-size="33" font-weight="600">讲：解释理由，不背答案</text></g><g id="s5-note3"><rect x="1044" y="499" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="494" width="680" height="125" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="1065" y="543" fill="#243047" font-size="33" font-weight="600">验：换一道未讲过的新题</text></g></svg><div class="clip subtitle" id="s5-cap0" data-start="0.75" data-duration="5.6880433" data-track-index="5">拿到自己的后测结果，先选最值得修补的一到两个知识点。</div><div class="clip subtitle" id="s5-cap1" data-start="6.4380433" data-duration="7.6999566999999995" data-track-index="5">老师会看你是读漏条件、关系没理解、计算失误，还是没有回答最终问题。</div><div class="clip subtitle" id="s5-cap2" data-start="14.838" data-duration="4.6826086" data-track-index="5">先遮住解析，自己指出第一处出错的位置。</div><div class="clip subtitle" id="s5-cap3" data-start="19.5206086" data-duration="8.4893914" data-track-index="5">关系没理解，就回到对应的动画；只有计算出错，就保留正确关系，重新核对计算。</div><div class="clip subtitle" id="s5-cap4" data-start="28.71" data-duration="4.247826000000001" data-track-index="5">随后用自己的话讲清错因和正确理由。</div><div class="clip subtitle" id="s5-cap5" data-start="32.957826" data-duration="6.044173999999999" data-track-index="5">老师再给一道没有讲过的迁移题，让你收起提示独立完成。</div><div class="clip subtitle" id="s5-cap6" data-start="39.702" data-duration="6.2043477000000005" data-track-index="5">如果新题仍卡住，就记录卡在哪一步，留作下次教学的起点。</div><div class="clip subtitle" id="s5-cap7" data-start="45.9063477" data-duration="7.591652300000001" data-track-index="5">复盘不是把整张试卷抄一遍，也不是所有同学一起反复练同一种面积题。</div><div class="progress" id="s5-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#s5-step0',{"opacity":0,"x":-90});tl.to('#s5-step0',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.15);gsap.set('#s5-step1',{"opacity":0,"x":90});tl.to('#s5-step1',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},15.238);gsap.set('#s5-step2',{"opacity":0,"x":-90});tl.to('#s5-step2',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},29.11);gsap.set('#s5-step3',{"opacity":0,"x
