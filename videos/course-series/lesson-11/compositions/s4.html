th="3"/><text x="168" y="556" fill="#243047" font-size="32" font-weight="600">80÷5＝16；16×5＝80</text></g><g id="s4-note0"><rect x="1044" y="40" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="35" width="680" height="125" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="1065" y="84" fill="#243047" font-size="33" font-weight="600">总量：15×4＋20＝80</text></g><g id="s4-note1"><rect x="1044" y="193" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="188" width="680" height="125" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="1065" y="237" fill="#243047" font-size="33" font-weight="600">新份数：4＋1＝5</text></g><g id="s4-note2"><rect x="1044" y="346" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="341" width="680" height="125" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="1065" y="390" fill="#243047" font-size="33" font-weight="600">平均：80÷5＝16</text></g><g id="s4-note3"><rect x="1044" y="499" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="494" width="680" height="125" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="1065" y="543" fill="#243047" font-size="33" font-weight="600">反查：(16×5−20)÷4＝15</text></g></svg><div class="clip subtitle" id="s4-cap0" data-start="0.75" data-duration="5.6472825" data-track-index="5">旧总量十五乘四，等于六十，加上二十，得到八十。</div><div class="clip subtitle" id="s4-cap1" data-start="6.3972825" data-duration="1.9565217000000006" data-track-index="5">这两步都正确。</div><div class="clip subtitle" id="s4-cap2" data-start="8.3538042" data-duration="3.3121957999999996" data-track-index="5">错误出现在最后仍然除以四。</div><div class="clip subtitle" id="s4-cap3" data-start="12.366" data-duration="7.0059781" data-track-index="5">加入一个数以后，共有五个数，所以八十要平均分成五份，得到十六。</div><div class="clip subtitle" id="s4-cap4" data-start="19.3719781" data-duration="4.438021900000001" data-track-index="5">图上四份扩成五份，份数也必须更新。</div><div class="clip subtitle" id="s4-cap5" data-start="24.51" data-duration="9.428" data-track-index="5">检查答案十六乘五，回到八十，扣掉加入的二十，剩六十，再除以原来的四份，恰好十五。</div><div class="clip subtitle" id="s4-cap6" data-start="34.638" data-duration="4.044021600000001" data-track-index="5">这一题要修补的是份数变化，不是乘法。</div><div class="clip subtitle" id="s4-cap7" data-start="38.6820216" data-duration="10.3039784" data-track-index="5">把错因写成“加入以后，忘记更新分母”，再做一道未讲过的加入或移除题，才知道自己能否独立处理。</div><div class="progress" id="s4-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#s4-value0',{"opacity":0,"y":24});tl.to('#s4-value0',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},16.266);gsap.set('#s4-value1',{"opacity":0,"y":24});tl.to('#s4-value1',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},16.416);gsap.set('#s4-value2',{"opacity":0,"y":24});tl.to('#s4-value2',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},16.566);gsap.set('#s4-value3',{"opacity":0,"y":24});tl.to('#s4-value3',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},16.716);gsap.set('#s4-share4',{"opacity":0,"x":-180});tl.to('#s4-share4',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},13.266);gsap.set('#s4-value4',{"opacity":0,"y":24});tl.to('#s4-value4',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},16.866);gsap.set('#s4-total',{"opacity":0,"y":24});tl.to('#s4-total',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},25.41);gsap.set('#s4-note0',{"opacity":0,"x":55});tl.to('#s4-note0',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.65);gsap.set('#s4-note1',{"opacity":0,"x":55});tl.to('#s4-note1',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},13.266);gsap.set('#s4-note2',{"opacity":0,"x":55});tl.to('#s4-note2',{"dura
