<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"></head><body><template><style>@font-face{font-family:'Microsoft YaHei';src:local('Microsoft YaHei')}*{box-sizing:border-box}body{margin:0}.scene{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#FFF9E9;color:#243047;font-family:'Microsoft YaHei',sans-serif;padding:36px 70px}.head{display:flex;justify-content:space-between;align-items:center;height:56px;font-size:27px;font-weight:700}.tag{padding:10px 22px;border:3px solid #243047;border-radius:17px;background:#B395FF}h1{font-size:56px;line-height:1.2;margin:25px 0 20px}.board{width:1780px;height:687px;display:block;overflow:visible}.subtitle{position:absolute;left:72px;right:72px;bottom:26px;min-height:103px;padding:16px 28px;background:#243047;color:white;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:35px;line-height:1.45}.progress{position:absolute;bottom:0;left:0;width:1920px;height:8px;background:#FF8666;transform-origin:left}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin:0 5px;border:2px solid #243047}.active{background:#243047}</style><div id="s2" data-composition-id="s2" data-width="1920" data-height="1080" data-duration="56.833333333333336"><div class="scene"><div class="head"><span class="tag">第11课 · 跟着图形想一想</span><span>思维实验室 · 把数学讲明白</span><span><i class="dot active"></i><i class="dot active"></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i></span></div><h1 id="s2-heading">算对了，位置解释错了</h1><svg class="board" viewBox="0 0 1760 680" role="img" aria-label="算对了，位置解释错了"><rect x="14" y="17" width="980" height="650" rx="20" fill="#243047"/><rect x="10" y="12" width="980" height="650" rx="20" fill="white" stroke="#243047" stroke-width="3"/><text x="45" y="65" fill="#243047" font-size="35" font-weight="600">先缩小到一个周期，再看整组边界</text><g id="s2-car0"><rect x="64" y="180" width="190" height="120" rx="20" fill="#243047"/><rect x="60" y="175" width="190" height="120" rx="20" fill="#FF8666" stroke="#243047" stroke-width="3"/><text x="78" y="246" fill="#243047" font-size="32" font-weight="600">红</text></g><text x="95" y="350" fill="#243047" font-size="30" font-weight="600">第1位</text><g id="s2-car1"><rect x="289" y="180" width="190" height="120" rx="20" fill="#243047"/><rect x="285" y="175" width="190" height="120" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="303" y="246" fill="#243047" font-size="32" font-weight="600">黄</text></g><text x="320" y="350" fill="#243047" font-size="30" font-weight="600">第2位</text><g id="s2-car2"><rect x="514" y="180" width="190" height="120" rx="20" fill="#243047"/><rect x="510" y="175" width="190" height="120" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="528" y="246" fill="#243047" font-size="32" font-weight="600">蓝</text></g><text x="545" y="350" fill="#243047" font-size="30" font-weight="600">第3位</text><g id="s2-car3"><rect x="739" y="180" width="190" height="120" rx="20" fill="#243047"/><rect x="735" y="175" width="190" height="120" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="753" y="246" fill="#243047" font-size="32" font-weight="600">绿</text></g><text x="770" y="350" fill="#243047" font-size="30" font-weight="600">第4位</text><g id="s2-ring"><rect x="50" y="165" width="210" height="140" rx="23" fill="none" stroke="#243047" stroke-width="6"/></g><g id="s2-wrong"><rect x="114" y="445" width="770" height="90" rx="20" fill="#243047"/><rect x="110" y="440" width="770" height="90" rx="20" fill="#FF8666" stroke="#243047" stroke-width="3"/><text x="128" y="496" fill="#243047" font-size="32" font-weight="600">余0不是首位；36绿，37才是红</text></g><g id="s2-note0"><rect x="1044" y="40" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="35" width="680" height="125" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="1065" y="84" fill="#243047" font-size="33" font-weight="600">36÷4＝9：计算正确</text></g><g id="s2-note1"><rect x="1044" y="193" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="188" width="680" height="125" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="1065" y="237" fill="#243047" font-size="33" font-weight="600">余0 → 本组末位</text></g><g id="s2-note2"><rect x="1044" y="346" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="341" width="680" height="125" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="1065" y="390" fill="#243047" font-size="33" font-weight="600">36绿；37才是红</text></g><g id="s2-note3"><rect x="1044" y="499" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="494" width="680" height="125" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="1065" y="543" fill="#243047" font-size="33" font-weight="600">错因：余数的位置含义</text></g></svg><div class="clip subtitle" id="s2-cap0" data-start="0.75" data-duration="4.0711955" data-track-index="5">三十六除以四等于九，计算没有错。</div><div class="clip subtitle" id="s2-cap1" data-start="4.8211955" data-duration="4.1304347" data-track-index="5">真正的问题出在把余数零理解成第一位。</div><div class="clip subtitle" id="s2-cap2" data-start="8.9516302" data-duration="4.0823698" data-track-index="5">先定位错误类型，才知道该补哪一步。</div><div class="clip subtitle" id="s2-cap3" data-start="13.734" data-duration="3.310326" data-track-index="5">不用从第一面数到第三十六面。</div><div class="clip subtitle" id="s2-cap4" data-start="17.044326" data-duration="4.6331521" data-track-index="5">先看一小组，第四面是绿，第八面还是绿。</div><div class="clip subtitle" id="s2-cap5" data-start="21.677478100000002" data-duration="4.1725219" data-track-index="5">每次正好整除，目标都在一组末尾。</div><div class="clip subtitle" id="s2-cap6" data-start="26.55" data-duration="4.2749999" data-track-index="5">第三十六面是第九组的末尾，所以是绿。</div><div class="clip subtitle" id="s2-cap7" data-start="30.824999899999998" data-duration="3.6684782" data-track-index="5">第三十七面才回到下一组的红色。</div><div class="clip subtitle" id="s2-cap8" data-start="34.4934781" data-duration="5.2045219" data-track-index="5">把相邻两面一起检查，比只背余数对应表更可靠。</div><div class="clip subtitle" id="s2-cap9" data-start="40.398" data-duration="5.7152172000000006" data-track-index="5">订正时写一句原因：我把整组末位误当成下一组首位。</div><div class="clip subtitle" id="s2-cap10" data-start="46.1132172" data-duration="4.7282608" data-track-index="5">下次看到余数零，先用第四面这个小例子核对。</div><div class="clip subtitle" id="s2-cap11" data-start="50.841478" data-duration="4.552522" data-track-index="5">只抄一个绿色，不能说明问题已经解决。</div><div class="progress" id="s2-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});tl.to('#s2-ring',{"duration":0.85,"ease":"power2.inOut","x":675},15.634);tl.to('#s2-ring',{"duration":0.85,"ease":"power2.inOut","x":0},31.45);gsap.set('#s2-wrong',{"opacity":0,"y":24});tl.to('#s2-wrong',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},27.45);gsap.set('#s2-note0',{"opacity":0,"x":55});tl.to('#s2-note0',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.65);gsap.set('#s2-note1',{"opacity":0,"x":55});tl.to('#s2-note1',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},14.634);gsap.set('#s2-note2',{"opacity":0,"x":55});tl.to('#s2-note2',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},27.45);gsap.set('#s2-note3',{"opacity":0,"x":55});tl.to('#s2-note3',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},41.298);tl.fromTo('#s2-heading',{opacity:0,x:-35},{opacity:1,x:0,duration:.6},0);tl.fromTo('#s2-progress',{scaleX:0},{scaleX:1,duration:56.833333333333336,ease:'none'},0);window.__timelines['s2']=tl;}</script></template></body></html>
