<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"></head><body><template><style>@font-face{font-family:'Microsoft YaHei';src:local('Microsoft YaHei')}*{box-sizing:border-box}body{margin:0}.scene{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#FFF9E9;color:#243047;font-family:'Microsoft YaHei',sans-serif;padding:36px 70px}.head{display:flex;justify-content:space-between;align-items:center;height:56px;font-size:27px;font-weight:700}.tag{padding:10px 22px;border:3px solid #243047;border-radius:17px;background:#B395FF}h1{font-size:56px;line-height:1.2;margin:25px 0 20px}.board{width:1780px;height:687px;display:block;overflow:visible}.subtitle{position:absolute;left:72px;right:72px;bottom:26px;min-height:103px;padding:16px 28px;background:#243047;color:white;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:35px;line-height:1.45}.progress{position:absolute;bottom:0;left:0;width:1920px;height:8px;background:#FF8666;transform-origin:left}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin:0 5px;border:2px solid #243047}.active{background:#243047}</style><div id="s1" data-composition-id="s1" data-width="1920" data-height="1080" data-duration="35.25"><div class="scene"><div class="head"><span class="tag">第8课 · 先读完整题目</span><span>思维实验室 · 把数学讲明白</span><span><i class="dot active"></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i></span></div><h1 id="s1-heading">追赶从哪个时刻开始算？</h1><svg class="board" viewBox="0 0 1760 680" role="img" aria-label="追赶从哪个时刻开始算？"><rect x="29" y="25" width="1700" height="405" rx="20" fill="#243047"/><rect x="25" y="20" width="1700" height="405" rx="20" fill="white" stroke="#243047" stroke-width="3"/><text x="65" y="92" fill="#243047" font-size="40" font-weight="600">小明从学校出发，以每分钟60米的速度步行。5分钟后，小华从同一地点沿同一路线同方向</text><text x="65" y="151" fill="#243047" font-size="40" font-weight="600">出发，速度为每分钟90米。两人都不停留。小华出发后几分钟追上小明？</text><g id="s1-prompt"><rect x="64" y="570" width="1620" height="90" rx="20" fill="#243047"/><rect x="60" y="565" width="1620" height="90" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="90" y="624" fill="#243047" font-size="37" font-weight="600">先读完整条件，圈出已知与所求，再开始分析。</text></g></svg><div class="clip subtitle" id="s1-cap0" data-start="0.75" data-duration="2.7668477" data-track-index="5">先读清两人的出发时间。</div><div class="clip subtitle" id="s1-cap1" data-start="3.5168477" data-duration="3.5733695" data-track-index="5">小明先走五分钟，小华才出发。</div><div class="clip subtitle" id="s1-cap2" data-start="7.0902172000000006" data-duration="6.471782800000001" data-track-index="5">题目问的是小华出发以后几分钟，而不是从小明出发算起。</div><div class="clip subtitle" id="s1-cap3" data-start="14.262" data-duration="5.3347825" data-track-index="5">两个人从同一地点、同一方向前进，而且都不停留。</div><div class="clip subtitle" id="s1-cap4" data-start="19.5967825" data-duration="4.5972175" data-track-index="5">我们把小华出发的时刻设为追赶计时的零点。</div><div class="clip subtitle" id="s1-cap5" data-start="24.894000000000002" data-duration="3.6635868" data-track-index="5">在这个零点，小明已经走过一段路。</div><div class="clip subtitle" id="s1-cap6" data-start="28.5575868" data-duration="5.2844131999999995" data-track-index="5">先找到领先距离，才能研究这段差距怎样缩小。</div><div class="progress" id="s1-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#s1-prompt',{"opacity":0,"x":-55});tl.to('#s1-prompt',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.65);tl.fromTo('#s1-heading',{opacity:0,x:-35},{opacity:1,x:0,duration:.6},0);tl.fromTo('#s1-progress',{scaleX:0},{scaleX:1,duration:35.25,ease:'none'},0);window.__timelines['s1']=tl;}</script></template></body></html>
