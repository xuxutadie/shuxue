<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"></head><body><template><style>@font-face{font-family:'Microsoft YaHei';src:local('Microsoft YaHei')}*{box-sizing:border-box}body{margin:0}.scene{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#FFF9E9;color:#243047;font-family:'Microsoft YaHei',sans-serif;padding:36px 70px}.head{display:flex;justify-content:space-between;align-items:center;height:56px;font-size:27px;font-weight:700}.tag{padding:10px 22px;border:3px solid #243047;border-radius:17px;background:#B395FF}h1{font-size:56px;line-height:1.2;margin:25px 0 20px}.board{width:1780px;height:687px;display:block;overflow:visible}.subtitle{position:absolute;left:72px;right:72px;bottom:26px;min-height:103px;padding:16px 28px;background:#243047;color:white;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:35px;line-height:1.45}.progress{position:absolute;bottom:0;left:0;width:1920px;height:8px;background:#FF8666;transform-origin:left}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin:0 5px;border:2px solid #243047}.active{background:#243047}</style><div id="s7" data-composition-id="s7" data-width="1920" data-height="1080" data-duration="51.791666666666664"><div class="scene"><div class="head"><span class="tag">第8课 · 跟着图形想一想</span><span>思维实验室 · 把数学讲明白</span><span><i class="dot active"></i><i class="dot active"></i><i class="dot active"></i><i class="dot active"></i><i class="dot active"></i><i class="dot active"></i><i class="dot active"></i><i class="dot "></i></span></div><h1 id="s7-heading">用两人的实际路程检查</h1><svg class="board" viewBox="0 0 1760 680" role="img" aria-label="用两人的实际路程检查"><rect x="14" y="17" width="980" height="650" rx="20" fill="#243047"/><rect x="10" y="12" width="980" height="650" rx="20" fill="white" stroke="#243047" stroke-width="3"/><text x="45" y="65" fill="#243047" font-size="36" font-weight="600">同一个标尺：两人的位置与差距</text><g id="s7-road0"><path d="M80 220H920" fill="none" stroke="#243047" stroke-width="4" stroke-linecap="round"/></g><text x="80" y="170" fill="#243047" font-size="30" font-weight="600">小明 60米/分</text><g id="s7-road1"><path d="M80 415H920" fill="none" stroke="#243047" stroke-width="4" stroke-linecap="round"/></g><text x="80" y="365" fill="#243047" font-size="30" font-weight="600">小华 90米/分</text><g id="s7-slow"><circle cx="276" cy="220" r="26" fill="#B395FF" stroke="#243047" stroke-width="3"/></g><g id="s7-fast"><circle cx="90" cy="415" r="26" fill="#FF8666" stroke="#243047" stroke-width="3"/></g><g id="s7-gap"><rect x="90" y="295" width="186" height="30" fill="#FFD43B"/></g><g id="s7-same"><path d="M871.2 150V460" stroke="#62DDB5" stroke-width="8"/></g><g id="s7-verify"><text x="120" y="570" fill="#243047" font-size="32" font-weight="600">小华走14分；小明走21分 → 都是1260米</text></g><text x="80" y="120" fill="#243047" font-size="30" font-weight="600">停留期间：快者不动，慢者继续走</text><g id="s7-note0"><rect x="1044" y="40" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="35" width="680" height="125" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="1065" y="84" fill="#243047" font-size="33" font-weight="600">小华行走：16−2＝14分</text></g><g id="s7-note1"><rect x="1044" y="193" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="188" width="680" height="125" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="1065" y="237" fill="#243047" font-size="33" font-weight="600">小华：90×14＝1260米</text></g><g id="s7-note2"><rect x="1044" y="346" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="341" width="680" height="125" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="1065" y="390" fill="#243047" font-size="33" font-weight="600">小明：60×(16＋5)＝1260米</text></g><g id="s7-note3"><rect x="1044" y="499" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="494" width="680" height="125" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="1065" y="543" fill="#243047" font-size="33" font-weight="600">核验位置相同 ✓</text></g></svg><div class="clip subtitle" id="s7-cap0" data-start="0.75" data-duration="7.264130300000001" data-track-index="5">十六分钟是小华从首次出发到相遇经过的时间，但他不是一直在走。</div><div class="clip subtitle" id="s7-cap1" data-start="8.0141303" data-duration="4.3478696999999995" data-track-index="5">减去停留的两分钟，实际走路十四分钟。</div><div class="clip subtitle" id="s7-cap2" data-start="13.062" data-duration="4.4652173" data-track-index="5">小华走九十乘十四，等于一千二百六十米。</div><div class="clip subtitle" id="s7-cap3" data-start="17.5272173" data-duration="6.1627827" data-track-index="5">小明没有停，还比小华早出发五分钟，总共走二十一分钟。</div><div class="clip subtitle" id="s7-cap4" data-start="24.39" data-duration="4.7097825" data-track-index="5">小明六十乘二十一，也是,一千二百六十米。</div><div class="clip subtitle" id="s7-cap5" data-start="29.0997825" data-duration="7.1902175" data-track-index="5">同一个出发点，同一个相遇位置，两人的路程应当相等，这个检查成立。</div><div class="clip subtitle" id="s7-cap6" data-start="36.99" data-duration="8.5548911" data-track-index="5">如果只给原来不停的十分钟加两分钟，会得到十二分钟，却漏掉停留时小明新走的距离。</div><div class="clip subtitle" id="s7-cap7" data-start="45.5448911" data-duration="4.833108899999999" data-track-index="5">时间变了，差距也跟着变，必须重新分析。</div><div class="progress" id="s7-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});tl.to('#s7-slow',{"duration":5,"ease":"power2.inOut","x":595.2},1.65);tl.to('#s7-fast',{"duration":5,"ease":"power2.inOut","x":781.2},1.65);tl.to('#s7-gap',{"duration":0.85,"ease":"power2.inOut","opacity":0},1.65);gsap.set('#s7-same',{"opacity":0,"y":24});tl.to('#s7-same',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},25.29);gsap.set('#s7-verify',{"opacity":0,"y":24});tl.to('#s7-verify',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},26.29);gsap.set('#s7-note0',{"opacity":0,"x":55});tl.to('#s7-note0',{"duration":0.85,"ease":"power2.inOut","opac
