l="none" stroke="#243047" stroke-width="4" stroke-linecap="round"/></g><text x="40" y="185" fill="#243047" font-size="30" font-weight="600">小明 / 慢者</text><g id="s2-road1"><path d="M70 450H910" fill="none" stroke="#243047" stroke-width="4" stroke-linecap="round"/></g><text x="40" y="385" fill="#243047" font-size="30" font-weight="600">小华 / 快者</text><g id="s2-slow"><circle cx="336" cy="250" r="27" fill="#B395FF" stroke="#243047" stroke-width="3"/></g><g id="s2-fast"><circle cx="90" cy="450" r="27" fill="#FF8666" stroke="#243047" stroke-width="3"/></g><g id="s2-gap"><rect x="90" y="315" width="245.99999999999997" height="32" rx="9" fill="#FFD43B"/></g><g id="s2-gaplabel"><text x="430" y="345" fill="#243047" font-size="32" font-weight="600">领先300米</text></g><text x="75" y="520" fill="#243047" font-size="27" font-weight="600">0</text><text x="808" y="520" fill="#243047" font-size="27" font-weight="600">900米</text><text x="45" y="620" fill="#243047" font-size="32" font-weight="600">从快者出发时计时：领先距离已经存在。</text><g id="s2-note0"><rect x="1044" y="40" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="35" width="680" height="125" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="1065" y="84" fill="#243047" font-size="33" font-weight="600">追赶0分钟：小华刚出发</text></g><g id="s2-note1"><rect x="1044" y="193" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="188" width="680" height="125" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="1065" y="237" fill="#243047" font-size="33" font-weight="600">小明领先：60×5＝300米</text></g><g id="s2-note2"><rect x="1044" y="346" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="341" width="680" height="125" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="1065" y="390" fill="#243047" font-size="33" font-weight="600">小明仍在走，小华开始追</text></g><g id="s2-note3"><rect x="1044" y="499" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="494" width="6
