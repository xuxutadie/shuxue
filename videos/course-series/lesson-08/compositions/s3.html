<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"></head><body><template><style>@font-face{font-family:'Microsoft YaHei';src:local('Microsoft YaHei')}*{box-sizing:border-box}body{margin:0}.scene{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#FFF9E9;color:#243047;font-family:'Microsoft YaHei',sans-serif;padding:36px 70px}.head{display:flex;justify-content:space-between;align-items:center;height:56px;font-size:27px;font-weight:700}.tag{padding:10px 22px;border:3px solid #243047;border-radius:17px;background:#B395FF}h1{font-size:56px;line-height:1.2;margin:25px 0 20px}.board{width:1780px;height:687px;display:block;overflow:visible}.subtitle{position:absolute;left:72px;right:72px;bottom:26px;min-height:103px;padding:16px 28px;background:#243047;color:white;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:35px;line-height:1.45}.progress{position:absolute;bottom:0;left:0;width:1920px;height:8px;background:#FF8666;transform-origin:left}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin:0 5px;border:2px solid #243047}.active{background:#243047}</style><div id="s3" data-composition-id="s3" data-width="1920" data-height="1080" data-duration="43.5"><div class="scene"><div class="head"><span class="tag">第8课 · 跟着图形想一想</span><span>思维实验室 · 把数学讲明白</span><span><i class="dot active"></i><i class="dot active"></i><i class="dot active"></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i></span></div><h1 id="s3-heading">每分钟，差距缩小多少？</h1><svg class="board" viewBox="0 0 1760 680" role="img" aria-label="每分钟，差距缩小多少？"><rect x="14" y="17" width="980" height="650" rx="20" fill="#243047"/><rect x="10" y="12" width="980" height="650" rx="20" fill="white" stroke="#243047" stroke-width="3"/><text x="40" y="65" fill="#243047" font-size="36" font-weight="600">同一路线 · 同一个位置标尺</text><g id="s3-road0"><path d="M70 250H910" fill="none" stroke="#243047" stroke-width="4" stroke-linecap="round"/></g><text x="40" y="185" fill="#243047" font-size="30" font-weight="600">小明 / 慢者</text><g id="s3-road1"><path d="M70 450H910" fill="none" stroke="#243047" stroke-width="4" stroke-linecap="round"/></g><text x="40" y="385" fill="#243047" font-size="30" font-weight="600">小华 / 快者</text><g id="s3-slow"><circle cx="336" cy="250" r="27" fill="#B395FF" stroke="#243047" stroke-width="3"/></g><g id="s3-fast"><circle cx="90" cy="450" r="27" fill="#FF8666" stroke="#243047" stroke-width="3"/></g><g id="s3-gap"><rect x="90" y="315" width="245.99999999999997" height="32" rx="9" fill="#FFD43B"/></g><g id="s3-gaplabel"><text x="430" y="345" fill="#243047" font-size="32" font-weight="600">领先300米</text></g><text x="75" y="520" fill="#243047" font-size="27" font-weight="600">0</text><text x="808" y="520" fill="#243047" font-size="27" font-weight="600">900米</text><text x="45" y="620" fill="#243047" font-size="32" font-weight="600">每分钟两人都前进，但差距减少30米。</text><g id="s3-note0"><rect x="1044" y="40" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="35" width="680" height="125" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="1065" y="84" fill="#243047" font-size="33" font-weight="600">1分钟：快者90米，慢者60米</text></g><g id="s3-note1"><rect x="1044" y="193" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="188" width="680" height="125" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="1065" y="237" fill="#243047" font-size="33" font-weight="600">每分钟缩短：90−60＝30米</text></g><g id="s3-note2"><rect x="1044" y="346" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="341" width="680" height="125" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="1065" y="390" fill="#243047" font-size="33" font-weight="600">差距：300 → 270 → 240</text></g><g id="s3-note3"><rect x="1044" y="499" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="494" width="680" height="125" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="1065" y="543" fill="#243047" font-size="33" font-weight="600">速度差描述差距的变化</text></g></svg><div class="clip subtitle" id="s3-cap0" data-start="0.75" data-duration="4.981521600000001" data-track-index="5">追赶一分钟，小华走九十米，小明又走六十米。</div><div class="clip subtitle" id="s3-cap1" data-start="5.731521600000001" data-duration="4.6624783999999995" data-track-index="5">小华多走的三十米，才用来缩小原来的差距。</div><div class="clip subtitle" id="s3-cap2" data-start="11.094" data-duration="5.103804200000001" data-track-index="5">所以每分钟差距缩小九十减六十，等于三十米。</div><div class="clip subtitle" id="s3-cap3" data-start="16.1978042" data-duration="6.652195799999999" data-track-index="5">动画里两人都向右走，中间的差距从三百变成二百七十。</div><div class="clip subtitle" id="s3-cap4" data-start="23.55" data-duration="5.1445651" data-track-index="5">再过一分钟，差距又减少三十，变成二百四十。</div><div class="clip subtitle" id="s3-cap5" data-start="28.6945651" data-duration="4.9794349" data-track-index="5">每分钟都这样减少，才能把领先距离一点点补完。</div><div class="clip subtitle" id="s3-cap6" data-start="34.374" data-duration="2.1961956" data-track-index="5">这个三十叫速度差。</div><div class="clip subtitle" id="s3-cap7" data-start="36.5701956" data-duration="5.5278044" data-track-index="5">它表示差距变化的快慢，不是任何一个人的实际速度。</div><div class="progress" id="s3-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});tl.to('#s3-slow',{"duration":2,"ease":"power2.inOut","x":49.199999999999996},2.65);tl.to('#s3-fast',{"duration":2,"ease":"power2.inOut","x":73.8},2.65);tl.to('#s3-gap',{"duration":2,"ease":"power2.inOut","x":73.8,"scaleX":0.9,"transformOrigin":"left center"},2.65);tl.to('#s3-slow',{"duration":2,"ease":"power2.inOut","x":98.39999999999999},25.45);tl.to('#s3-fast',{"duration":2,"ease":"power2.inOut","x":147.6},25.45);tl.to('#s3-gap',{"duration":2,"ease":"power2.inOut","x":147.6,"scaleX":0.8,"transformOrigin":"left center"},25.45);tl.to('#s3-gaplabel',{"duration":0.85,"ease":"power2.inOut","opacity":0},2.65);gsap.set('#s3-note0',{"opacity":0,"x":55});tl.to('#s3-note0',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.65);gsap.set('#s3-note1',{"opacity":0,"x":55});tl.to('#s3-note1',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},11.994);gsap.set('#s3-note2',{"opacity":0,"x":55});tl.to('#s3-note2',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},24.45);gsap.set('#s3-note3',{"opacity":0,"x":55});tl.to('#s3-note3',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},35.274);tl.fromTo('#s3-heading',{opacity:0,x:-35},{opacity:1,x:0,duration:.6},0);tl.fromTo('#s3-progress',{scaleX:0},{scaleX:1,duration:43.5,ease:'none'},0);window.__timelines['s3']=tl;}</script></template></body></html>
