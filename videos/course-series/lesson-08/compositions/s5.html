华追4分钟后原</text><text x="65" y="151" fill="#243047" font-size="40" font-weight="600">地停2分钟，再以90米/分钟继续；小明一直不停。从小华首次出发到追上，共经过多少分</text><text x="65" y="210" fill="#243047" font-size="40" font-weight="600">钟？</text><g id="s5-prompt"><rect x="64" y="570" width="1620" height="90" rx="20" fill="#243047"/><rect x="60" y="565" width="1620" height="90" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="90" y="624" fill="#243047" font-size="37" font-weight="600">先读完整条件，圈出已知与所求，再开始分析。</text></g></svg><div class="clip subtitle" id="s5-cap0" data-start="0.75" data-duration="8.6499998" data-track-index="5">小明以60米/分钟从起点沿直路走，5分钟后小华以90米/分钟同向追赶。</div><div class="clip subtitle" id="s5-cap1" data-start="9.3999998" data-duration="7.812499799999999" data-track-index="5">小华追4分钟后原地停2分钟，再以90米/分钟继续；小明一直不停。</div><div class="clip subtitle" id="s5-cap2" data-start="17.212499599999997" data-duration="4.653500400000002" data-track-index="5">从小华首次出发到追上，共经过多少分钟？</div><div class="clip subtitle" id="s5-cap3" data-start="22.566000000000003" data-duration="4.356521600000001" data-track-index="5">把过程分成追赶、停留、再追赶三段。</div><div class="clip subtitle" id="s5-cap4" data-start="26.922521600000003" data-duration="5.4554784000000005" data-track-index="5">停留时不是两人都不动，必须单独观察这一段的差距。</div><div class="progress" id="s5-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#s5-prompt',{"opacity":0,"x":-55});tl.to('#s5-prompt',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.65);tl.fromTo('#s5-heading',{opacity:0,x:-35},{opacity:1,x:0,duration:.6},0);tl.fromTo('#s5-progress',{scaleX:0},{scaleX:1,duration:33.791666666666664,ease:'none'},0);window.__timelines['s5']=tl;}</script></template></body></html>
