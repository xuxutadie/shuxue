<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"></head><body><template><style>@font-face{font-family:'Microsoft YaHei';src:local('Microsoft YaHei')}*{box-sizing:border-box}body{margin:0}.scene{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#FFF9E9;color:#243047;font-family:'Microsoft YaHei',sans-serif;padding:36px 70px}.head{display:flex;justify-content:space-between;align-items:center;height:56px;font-size:27px;font-weight:700}.tag{padding:10px 22px;border:3px solid #243047;border-radius:17px;background:#B395FF}h1{font-size:56px;line-height:1.2;margin:25px 0 20px}.board{width:1780px;height:687px;display:block;overflow:visible}.subtitle{position:absolute;left:72px;right:72px;bottom:26px;min-height:103px;padding:16px 28px;background:#243047;color:white;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:35px;line-height:1.45}.progress{position:absolute;bottom:0;left:0;width:1920px;height:8px;background:#FF8666;transform-origin:left}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin:0 5px;border:2px solid #243047}.active{background:#243047}</style><div id="s3" data-composition-id="s3" data-width="1920" data-height="1080" data-duration="42.375"><div class="scene"><div class="head"><span class="tag">第7课 · 跟着图形想一想</span><span>思维实验室 · 把数学讲明白</span><span><i class="dot active"></i><i class="dot active"></i><i class="dot active"></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i></span></div><h1 id="s3-heading">一格的边长和面积不同</h1><svg class="board" viewBox="0 0 1760 680" role="img" aria-label="一格的边长和面积不同"><rect x="14" y="17" width="980" height="650" rx="20" fill="#243047"/><rect x="10" y="12" width="980" height="650" rx="20" fill="white" stroke="#243047" stroke-width="3"/><g id="s3-sq0"><rect x="110" y="130" width="90" height="90" fill="#45C7FF" stroke="#243047" stroke-width="3"/></g><g id="s3-sq1"><rect x="200" y="130" width="90" height="90" fill="#45C7FF" stroke="#243047" stroke-width="3"/></g><g id="s3-sq2"><rect x="290" y="130" width="90" height="90" fill="#45C7FF" stroke="#243047" stroke-width="3"/></g><g id="s3-sq3"><rect x="110" y="220" width="90" height="90" fill="#45C7FF" stroke="#243047" stroke-width="3"/></g><g id="s3-sq4"><rect x="200" y="220" width="90" height="90" fill="#45C7FF" stroke="#243047" stroke-width="3"/></g><g id="s3-sq5"><rect x="290" y="220" width="90" height="90" fill="#45C7FF" stroke="#243047" stroke-width="3"/></g><g id="s3-half0"><polygon points="560,130 650,130 560,220" fill="#FFD43B" stroke="#243047" stroke-width="3"/></g><g id="s3-half1"><polygon points="805,130 805,220 715,220" fill="#B395FF" stroke="#243047" stroke-width="3"/></g><g id="s3-half2"><polygon points="560,290 650,290 560,380" fill="#FFD43B" stroke="#243047" stroke-width="3"/></g><g id="s3-half3"><polygon points="805,290 805,380 715,380" fill="#B395FF" stroke="#243047" stroke-width="3"/></g><text x="75" y="75" fill="#243047" font-size="38" font-weight="600">6个整格 ＋ 4个半格</text><text x="550" y="465" fill="#243047" font-size="34" font-weight="600">一格：2×2＝4</text><g id="s3-unit"><rect x="560" y="190" width="200" height="200" fill="#62DDB5" stroke="#243047" stroke-width="4"/><path d="M660 190V390M560 290H760" stroke="#243047" stroke-width="3"/></g><text x="45" y="620" fill="#243047" font-size="32" font-weight="600">8格，每格4平方厘米，共32平方厘米。</text><g id="s3-note0"><rect x="1044" y="40" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="35" width="680" height="125" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="1065" y="84" fill="#243047" font-size="33" font-weight="600">一格边长：2厘米</text></g><g id="s3-note1"><rect x="1044" y="193" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="188" width="680" height="125" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="1065" y="237" fill="#243047" font-size="33" font-weight="600">一格面积：2×2＝4平方厘米</text></g><g id="s3-note2"><rect x="1044" y="346" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="341" width="680" height="125" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="1065" y="390" fill="#243047" font-size="33" font-weight="600">8格×4＝32平方厘米</text></g><g id="s3-note3"><rect x="1044" y="499" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="494" width="680" height="125" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="1065" y="543" fill="#243047" font-size="33" font-weight="600">格数 × 每格面积</text></g></svg><div class="clip subtitle" id="s3-cap0" data-start="0.75" data-duration="9.836" data-track-index="5">放大一个边长两厘米的小方格，把每条边分成两个一厘米的小段，就能划成四个一平方厘米的小方块。</div><div class="clip subtitle" id="s3-cap1" data-start="11.286" data-duration="4.7097825" data-track-index="5">所以每格面积是二乘二，等于四平方厘米。</div><div class="clip subtitle" id="s3-cap2" data-start="15.9957825" data-duration="3.6622174999999997" data-track-index="5">边长两厘米，不代表面积也是二。</div><div class="clip subtitle" id="s3-cap3" data-start="20.358" data-duration="6.6255433" data-track-index="5">图形共八格，每格四平方厘米，八乘四等于三十二平方厘米。</div><div class="clip subtitle" id="s3-cap4" data-start="26.9835433" data-duration="4.3384567" data-track-index="5">这个乘法是在把相同单位格的面积相加。</div><div class="clip subtitle" id="s3-cap5" data-start="32.022" data-duration="8.924" data-track-index="5">检查单位，格数没有平方厘米，单位格面积有平方厘米，最后总面积也写平方厘米。</div><div class="progress" id="s3-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});tl.to('#s3-half0',{"duration":1.6,"ease":"power2.inOut","x":-450,"y":180},1.65);tl.to('#s3-half1',{"duration":1.6,"ease":"power2.inOut","x":-605,"y":180},1.9);tl.to('#s3-half2',{"duration":1.6,"ease":"power2.inOut","x":-360,"y":20},2.15);tl.to('#s3-half3',{"duration":1.6,"ease":"power2.inOut","x":-515,"y":20},2.4);gsap.set('#s3-unit',{"opacity":0,"y":24});tl.to('#s3-unit',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},4.65
