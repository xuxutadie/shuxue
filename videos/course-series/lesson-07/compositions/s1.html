<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"></head><body><template><style>@font-face{font-family:'Microsoft YaHei';src:local('Microsoft YaHei')}*{box-sizing:border-box}body{margin:0}.scene{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#FFF9E9;color:#243047;font-family:'Microsoft YaHei',sans-serif;padding:36px 70px}.head{display:flex;justify-content:space-between;align-items:center;height:56px;font-size:27px;font-weight:700}.tag{padding:10px 22px;border:3px solid #243047;border-radius:17px;background:#B395FF}h1{font-size:56px;line-height:1.2;margin:25px 0 20px}.board{width:1780px;height:687px;display:block;overflow:visible}.subtitle{position:absolute;left:72px;right:72px;bottom:26px;min-height:103px;padding:16px 28px;background:#243047;color:white;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:35px;line-height:1.45}.progress{position:absolute;bottom:0;left:0;width:1920px;height:8px;background:#FF8666;transform-origin:left}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin:0 5px;border:2px solid #243047}.active{background:#243047}</style><div id="s1" data-composition-id="s1" data-width="1920" data-height="1080" data-duration="36.5"><div class="scene"><div class="head"><span class="tag">第7课 · 先读完整题目</span><span>思维实验室 · 把数学讲明白</span><span><i class="dot active"></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i></span></div><h1 id="s1-heading">数出8格，就等于8平方厘米吗？</h1><svg class="board" viewBox="0 0 1760 680" role="img" aria-label="数出8格，就等于8平方厘米吗？"><rect x="29" y="25" width="1700" height="405" rx="20" fill="#243047"/><rect x="25" y="20" width="1700" height="405" rx="20" fill="white" stroke="#243047" stroke-width="3"/><text x="65" y="92" fill="#243047" font-size="40" font-weight="600">方格纸上的图形由6个完整方格和4个沿方格对角线分出的半格组成。每个小方格边长2厘米</text><text x="65" y="151" fill="#243047" font-size="40" font-weight="600">。这个图形的面积是多少平方厘米？请说明格数与实际面积的关系。</text><g id="s1-prompt"><rect x="64" y="570" width="1620" height="90" rx="20" fill="#243047"/><rect x="60" y="565" width="1620" height="90" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="90" y="624" fill="#243047" font-size="37" font-weight="600">先读完整条件，圈出已知与所求，再开始分析。</text></g></svg><div class="clip subtitle" id="s1-cap0" data-start="0.75" data-duration="2.1146738" data-track-index="5">先看完整条件。</div><div class="clip subtitle" id="s1-cap1" data-start="2.8646738" data-duration="6.168478200000001" data-track-index="5">图形有六个整格和四个半格，每个小方格的边长是两厘米。</div><div class="clip subtitle" id="s1-cap2" data-start="9.033152000000001" data-duration="4.024847999999999" data-track-index="5">要求实际面积，不能只报告占几格。</div><div class="clip subtitle" id="s1-cap3" data-start="13.758" data-duration="7.033152" data-track-index="5">这里的半格确实沿对角线平分方格，两个这样的半格可以拼成一格。</div><div class="clip subtitle" id="s1-cap4" data-start="20.791152" data-duration="4.2908479999999996" data-track-index="5">任意不规则的小碎片，不能都当成半格。</div><div class="clip subtitle" id="s1-cap5" data-start="25.782" data-duration="9.284" data-track-index="5">我们分两步：先把图形换算成等效的整格数，再计算每格面积，两者相乘才得到答案。</div><div class="progress" id="s1-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#s1-prompt',{"opacity":0,"x":-55});tl.to('#s1-prompt',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.65);tl.fromTo('#s1-heading',{opacity:0,x:-35},{opacity:1,x:0,duration:.6},0);tl.fromTo('#s1-progress',{scaleX:0},{scaleX:1,duration:36.5,ease:'none'},0);window.__timelines['s1']=tl;}</script></template></body></html>
