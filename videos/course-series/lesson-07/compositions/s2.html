e-width="3"/><text x="1065" y="390" fill="#243047" font-size="33" font-weight="600">6＋4÷2＝8格</text></g><g id="s2-note3"><rect x="1044" y="499" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="494" width="680" height="125" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="1065" y="543" fill="#243047" font-size="33" font-weight="600">只平移，不拉伸</text></g></svg><div class="clip subtitle" id="s2-cap0" data-start="0.75" data-duration="3.9081521" data-track-index="5">看图中六个完整方格，它们各算一格。</div><div class="clip subtitle" id="s2-cap1" data-start="4.658152100000001" data-duration="4.2478479" data-track-index="5">旁边四个三角形都是同样大小的半格。</div><div class="clip subtitle" id="s2-cap2" data-start="9.606" data-duration="4.6826086" data-track-index="5">把两个半格平移到一起，恰好拼成一个正方形。</div><div class="clip subtitle" id="s2-cap3" data-start="14.2886086" data-duration="3.9773914" data-track-index="5">再把另外两个半格拼起来，又得到一格。</div><div class="clip subtitle" id="s2-cap4" data-start="18.966" data-duration="5.3211955" data-track-index="5">四个半格相当于两格，加上原来的六格，共八格。</div><div class="clip subtitle" id="s2-cap5" data-start="24.2871955" data-duration="5.4508045" data-track-index="5">平移没有拉伸，也没有重叠，因此面积没有变化。</div><div class="clip subtitle" id="s2-cap6" data-start="30.438000000000002" data-duration="7.556" data-track-index="5">八是等效格数，后面还要乘以每格的面积，不能在这里就写八平方厘米。</div><div class="progress" id="s2-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});tl.to('#s2-half0',{"duration":1.6,"ease":"power2.inOut","x":-450,"y":180},10.506);tl.to('#s2-half1',{"duration":1.6,"ease":"power2.inOut","x":-605,"y":180},10.756);tl.to('#s2-half2',{"duration":1.6,"ease":"power2.inOut","x":-360,"y":20},11.006);tl.to('#s2-half3',{"duration":1.6,"ease":"power2.inOut","x":-515,"y":20},11.256);gsap.set('#s2-note0',{"opacity":0,"x":55});tl.to('#s2-note0',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.65);gsap.set('#s2-note1',{"opacity":0,"x":55});tl.to('#s2-note
