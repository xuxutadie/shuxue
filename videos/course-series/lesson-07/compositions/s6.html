th="80" height="80" rx="20" fill="#243047"/><rect x="550" y="370" width="80" height="80" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/></g><g id="s6-rear1"><rect x="554" y="295" width="80" height="80" rx="20" fill="#243047"/><rect x="550" y="290" width="80" height="80" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/></g><g id="s6-front0"><rect x="334" y="455" width="80" height="80" rx="20" fill="#243047"/><rect x="330" y="450" width="80" height="80" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/></g><g id="s6-front1"><rect x="334" y="375" width="80" height="80" rx="20" fill="#243047"/><rect x="330" y="370" width="80" height="80" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/></g><g id="s6-front2"><rect x="334" y="295" width="80" height="80" rx="20" fill="#243047"/><rect x="330" y="290" width="80" height="80" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/></g><text x="280" y="585" fill="#243047" font-size="30" font-weight="600">前列3块</text><text x="520" y="585" fill="#243047" font-size="30" font-weight="600">后列2块</text><g id="s6-view"><text x="70" y="180" fill="#243047" font-size="36" font-weight="600">正面：后列被遮挡</text></g><g id="s6-note0"><rect x="1044" y="40" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="35" width="680" height="125" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="1065" y="84" fill="#243047" font-size="33" font-weight="600">已知前列3块、后列2块</text></g><g id="s6-note1"><rect x="1044" y="193" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="188" width="680" height="125" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="1065" y="237" fill="#243047" font-size="33" font-weight="600">实物总数：3＋2＝5块</text></g><g id="s6-note2"><rect x="1044" y="346" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="341" width="680" height="125" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="1065" y="390" fill="#243047" font-size="33" font-weight="600">正面只露出3格</text></g><g id="s6-note3"><rect x="1044" y="499" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="494" width="680" height="125" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="1065" y="543" fill="#243047" font-size="33" font-weight="600">遮挡不会让后面的块消失</text></g></svg><div class="clip subtitle" id="s6-cap0" data-start="0.75" data-duration="2.9434782" data-track-index="5">现在用两列小方块摆积木。</div><div class="clip subtitle" id="s6-cap1" data-start="3.6934782" data-duration="5.258152" data-track-index="5">靠前的一列高三块，后面同一直线的一列高两块。</div><div class="clip subtitle" id="s6-cap2" data-start="8.9516302" data-duration="3.4823698000000007" data-track-index="5">两列都放在地面上，一共五块。</div><div class="clip subtitle" id="s6-cap3" data-start="13.134" data-duration="7.644565" data-track-index="5">沿正前方看，后面的两块被前面的三块挡住，正面轮廓只看到高三块。</div><div class="clip subtitle" id="s6-cap4" data-start="20.778565" data-duration="3.799435000000001" data-track-index="5">换到侧面，才可以看见两列的位置。</div><div class="clip subtitle" id="s6-cap5" data-start="25.278000000000002" data-duration="5.8510868" data-track-index="5">因此仅凭正面看到的三格，不能断定总共只有三块。</div><div class="clip subtitle" id="s6-cap6" data-start="31.1290868" data-duration="4.9209132" data-track-index="5">视图告诉你一个方向的轮廓，遮挡会藏住信息。</div><div class="clip subtitle" id="s6-cap7" data-start="36.75" data-duration="5.9869564" data-track-index="5">做空间题时，先确认从哪里看，再判断哪些部分会重叠。</div><div class="clip subtitle" id="s6-cap8" data-start="42.7369564" data-duration="5.5290436" data-track-index="5">需要总块数时，要结合其他方向或题目给出的条件。</div><div class="progress" id="s6-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});tl.to('#s6-rear0',{"duration":2,"ease":"power2.inOut","x":-220,"y":80,"opacity":0.12},15.034);tl.to('#s6-rear1',{"duration":2,"ease":"power2.inOut","x":-220,"y":80,"opacity":0.12},15.034);gsap.set('#s6-view',{"opacity":0,"y":24});tl.to('#s6-view',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":
