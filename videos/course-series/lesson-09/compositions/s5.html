"/></g><g id="s5-new2"><rect x="469" y="505" width="58" height="65" rx="20" fill="#243047"/><rect x="465" y="500" width="58" height="65" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/></g><text x="45" y="620" fill="#243047" font-size="32" font-weight="600">每天长2份、吃2份，原草储备不减少。</text><g id="s5-note0"><rect x="1044" y="40" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="35" width="680" height="125" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="1065" y="84" fill="#243047" font-size="33" font-weight="600">2头：吃2份，长2份</text></g><g id="s5-note1"><rect x="1044" y="193" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="188" width="680" height="125" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="1065" y="237" fill="#243047" font-size="33" font-weight="600">净变化0，原草保持30份</text></g><g id="s5-note2"><rect x="1044" y="346" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="341" width="680" height="125" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="1065" y="390" fill="#243047" font-size="33" font-weight="600">吃得比长得少：储备增加</text></g><g id="s5-note3"><rect x="1044" y="499" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="494" width="680" height="125" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="1065" y="543" fill="#243047" font-size="33" font-weight="600">只有净减少，才会吃完</text></g></svg><div class="clip subtitle" id="s5-cap0" data-start="0.75" data-duration="3.622826" data-track-index="5">仍然原草三十份，每天长两份。</div><div class="clip subtitle" id="s5-cap1" data-start="4.372826" data-duration="5.949174000000001" data-track-index="5">如果只有两头牛，每天也吃两份，储备每天的变化就是零。</div><div class="clip subtitle" id="s5-cap2" data-start="11.022" data-duration="5.7152172000000006" data-track-index="5">新长的刚好补上吃掉的，原草保持三十份，不会被吃完。</div><div class="clip subtitle" id="s5-cap3" data-start="16.7372172" data-duration="4.1207828" data-track-index="5">这里不能用三十除以零写出一个天数。</div><div class="clip subtitle" id="s5-cap4" data-start="21.558" data-duration="5.076630300000001" data-track-index="5">如果每天只吃一份，却长两份，草反而越来越多。</div><div class="clip subtitle" id="s5-cap5" data-start="26.634630299999998" data-duration="5.215369699999999" data-track-index="5">在题目这些条件始终不变的模型里，也不会吃完。</div><div class="clip subtitle" id="s5-cap6" data-start="32.550000000000004" data-duration="6.1771737" data-track-index="5">因此先判断消耗是否大于增长，才用原草除以净消耗。</div><div class="clip subtitle" id="s5-cap7" data-start="38.7271737" data-duration="3.2748263" data-track-index="5">算式要符合实际变化方向。</div><div class="progress" id="s5-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#s5-new1',{"opacity":0,"y":70});tl.to('#s5-new1',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},11.922);gsap.set('#s5-new2',{"opacity":0,"y":70});tl.to('#s5-new2',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},12.122);tl.to('#s5-new1',{"duration":0.85,"ease":"power2.inOut","y":-65,"opacity":0},13.922);tl.to('#s5-new2',{"duration":0.85,"ease":"power2.inOut","y":-65,"opacity":0},13.922);tl.to('#s5-grass0',{"duration":0.4,"ease":"power2.inOut","scale":1.035,"transformOrigin":"50% 50%","yoyo":true,"repeat":1},13.922);tl.to('#s5-grass1',{"duration":0.4,"ease":"power2.inOut","scale":1.035,"transformOrigin":"50% 50%","yoyo":true,"repeat":1},13.942);tl.to('#s5-grass2',{"duration":0.4,"ease":"power2.inOut","scale":1.035,"transformOrigin":"50% 50%","yoyo":true,"repeat":1},13.962);tl.to('#s5-grass3',{"duration":0.4,"ease":"power2.inOut","scale":1.035,"transformOrigin":"50% 50%","yoyo":true,"repeat":1},13.982000000000001);tl.to('#s5-grass4',{"duration":0.4,"ease":"power2.inOut","scale":1.035,"transformOrigin":"50% 50%","yoyo":true,"repeat":1},14.002);tl.to('#s5-grass5',{"duration":0.4,"ease":"power2.inOut","scale":1.035,"transformOrigin":"50% 50%","yoyo":true,"repeat":1},14.022);tl.to('#s5-grass6',{"duration":0.4,"ease"
