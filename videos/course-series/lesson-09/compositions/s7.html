<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"></head><body><template><style>@font-face{font-family:'Microsoft YaHei';src:local('Microsoft YaHei')}*{box-sizing:border-box}body{margin:0}.scene{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#FFF9E9;color:#243047;font-family:'Microsoft YaHei',sans-serif;padding:36px 70px}.head{display:flex;justify-content:space-between;align-items:center;height:56px;font-size:27px;font-weight:700}.tag{padding:10px 22px;border:3px solid #243047;border-radius:17px;background:#B395FF}h1{font-size:56px;line-height:1.2;margin:25px 0 20px}.board{width:1780px;height:687px;display:block;overflow:visible}.subtitle{position:absolute;left:72px;right:72px;bottom:26px;min-height:103px;padding:16px 28px;background:#243047;color:white;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:35px;line-height:1.45}.progress{position:absolute;bottom:0;left:0;width:1920px;height:8px;background:#FF8666;transform-origin:left}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin:0 5px;border:2px solid #243047}.active{background:#243047}</style><div id="s7" data-composition-id="s7" data-width="1920" data-height="1080" data-duration="55.25"><div class="scene"><div class="head"><span class="tag">第9课 · 跟着图形想一想</span><span>思维实验室 · 把数学讲明白</span><span><i class="dot active"></i><i class="dot active"></i><i class="dot active"></i><i class="dot active"></i><i class="dot active"></i><i class="dot active"></i><i class="dot active"></i><i class="dot "></i></span></div><h1 id="s7-heading">净减少量，不等于排出的总量</h1><svg class="board" viewBox="0 0 1760 680" role="img" aria-label="净减少量，不等于排出的总量"><rect x="14" y="17" width="980" height="650" rx="20" fill="#243047"/><rect x="10" y="12" width="980" height="650" rx="20" fill="white" stroke="#243047" stroke-width="3"/><text x="45" y="65" fill="#243047" font-size="36" font-weight="600">把储备下降与进、出水分开</text><g id="s7-tank"><path d="M230 150V535H730V150" fill="none" stroke="#243047" stroke-width="7"/></g><g id="s7-water"><rect x="235" y="235" width="490" height="295" fill="#45C7FF"/></g><g id="s7-incoming"><path d="M90 180H300V245" fill="none" stroke="#62DDB5" stroke-width="16"/><text x="60" y="130" fill="#243047" font-size="30" font-weight="600">进2升/分</text></g><g id="s7-outgoing"><path d="M650 440H850V510" fill="none" stroke="#FF8666" stroke-width="16"/><text x="680" y="590" fill="#243047" font-size="30" font-weight="600">排7升/分</text></g><g id="s7-net"><rect x="304" y="395" width="360" height="90" rx="20" fill="#243047"/><rect x="300" y="390" width="360" height="90" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="318" y="446" fill="#243047" font-size="32" font-weight="600">储备每分少5升</text></g><g id="s7-total"><text x="170" y="635" fill="#243047" font-size="34" font-weight="600">30 ＋ 2×6 ＝ 7×6 ＝ 42升</text></g><g id="s7-note0"><rect x="1044" y="40" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="35" width="680" height="125" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="1065" y="84" fill="#243047" font-size="33" font-weight="600">净减少：30÷6＝5升/分</text></g><g id="s7-note1"><rect x="1044" y="193" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="188" width="680" height="125" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="1065" y="237" fill="#243047" font-size="33" font-weight="600">排水：5＋2＝7升/分</text></g><g id="s7-note2"><rect x="1044" y="346" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="341" width="680" height="125" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="1065" y="390" fill="#243047" font-size="33" font-weight="600">总水量：30＋2×6＝42升</text></g><g id="s7-note3"><rect x="1044" y="499" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="494" width="680" height="125" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="1065" y="543" fill="#243047" font-size="33" font-weight="600">排出：7×6＝42升 ✓</text></g></svg><div class="clip subtitle" id="s7-cap0" data-start="0.75" data-duration="6.761412900000001" data-track-index="5">三十升原有的水要在六分钟里减完，平均每分钟净减少五升。</div><div class="clip subtitle" id="s7-cap1" data-start="7.511412900000001" data-duration="6.0025871" data-track-index="5">先画出储备水的下降量，而不是直接把五当成排水速度。</div><div class="clip subtitle" id="s7-cap2" data-start="14.214" data-duration="3.1472824999999998" data-track-index="5">每分钟还有两升新水流进来。</div><div class="clip subtitle" id="s7-cap3" data-start="17.3612825" data-duration="8.632717500000002" data-track-index="5">排水管要先排走新来的两升，再让原来的储备减少五升，所以每分钟应排七升。</div><div class="clip subtitle" id="s7-cap4" data-start="26.694000000000003" data-duration="6.666304200000001" data-track-index="5">检查六分钟，原水三十升，加上新进的十二升，一共四十二升。</div><div class="clip subtitle" id="s7-cap5" data-start="33.3603042" data-duration="4.561695799999999" data-track-index="5">排水七乘六，也是四十二升，正好排空。</div><div class="clip subtitle" id="s7-cap6" data-start="38.622" data-duration="7.6853259000000005" data-track-index="5">牛吃草与水池看起来不同，关系相同：原有量加上新增量，等于消耗量。</div><div class="clip subtitle" id="s7-cap7" data-start="46.307325899999995" data-duration="7.526674099999999" data-track-index="5">所求变了，算式方向也要调整，不能机械套用原有量除以净减少速度。</div><div class="progress" id="s7-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});tl.to('#s7-water',{"duration":6,"ease":"power2.inOut","scaleY":0,"transformOrigin":"center bottom"},4.65);gsap.set('#s7-incoming',{"opacity":0,"y":24});tl.to('#s7-incoming',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},14.114);gsap.set('#s7-outgoing',{"opacity":0,"y":24});tl.to('#s7-outgoing',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},17.114);gsap.set('#s7-net',{"opacity":0,"y":24});tl.to('#s7-net',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},19.114);gsap.set('#s7-total',{"o
