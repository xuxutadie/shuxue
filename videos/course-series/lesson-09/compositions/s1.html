<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"></head><body><template><style>@font-face{font-family:'Microsoft YaHei';src:local('Microsoft YaHei')}*{box-sizing:border-box}body{margin:0}.scene{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#FFF9E9;color:#243047;font-family:'Microsoft YaHei',sans-serif;padding:36px 70px}.head{display:flex;justify-content:space-between;align-items:center;height:56px;font-size:27px;font-weight:700}.tag{padding:10px 22px;border:3px solid #243047;border-radius:17px;background:#B395FF}h1{font-size:56px;line-height:1.2;margin:25px 0 20px}.board{width:1780px;height:687px;display:block;overflow:visible}.subtitle{position:absolute;left:72px;right:72px;bottom:26px;min-height:103px;padding:16px 28px;background:#243047;color:white;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:35px;line-height:1.45}.progress{position:absolute;bottom:0;left:0;width:1920px;height:8px;background:#FF8666;transform-origin:left}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin:0 5px;border:2px solid #243047}.active{background:#243047}</style><div id="s1" data-composition-id="s1" data-width="1920" data-height="1080" data-duration="34.833333333333336"><div class="scene"><div class="head"><span class="tag">第9课 · 先读完整题目</span><span>思维实验室 · 把数学讲明白</span><span><i class="dot active"></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i></span></div><h1 id="s1-heading">草一边被吃，一边还在长</h1><svg class="board" viewBox="0 0 1760 680" role="img" aria-label="草一边被吃，一边还在长"><rect x="29" y="25" width="1700" height="405" rx="20" fill="#243047"/><rect x="25" y="20" width="1700" height="405" rx="20" fill="white" stroke="#243047" stroke-width="3"/><text x="65" y="92" fill="#243047" font-size="40" font-weight="600">一片草地原有草量相同，草每天匀速生长，每头牛每天吃草量相同且不变。5头牛可吃10天</text><text x="65" y="151" fill="#243047" font-size="40" font-weight="600">，8头牛可吃5天，都恰好吃完。若放12头牛，从同样的初始状态开始，几天吃完？</text><g id="s1-prompt"><rect x="64" y="570" width="1620" height="90" rx="20" fill="#243047"/><rect x="60" y="565" width="1620" height="90" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="90" y="624" fill="#243047" font-size="37" font-weight="600">先读完整条件，圈出已知与所求，再开始分析。</text></g></svg><div class="clip subtitle" id="s1-cap0" data-start="0.75" data-duration="10.388" data-track-index="5">读题时要抓住三件事：两种情况从相同原草量开始，草每天长得一样快，每头牛每天吃得一样多。</div><div class="clip subtitle" id="s1-cap1" data-start="11.838" data-duration="3.5956521" data-track-index="5">五头牛吃十天，八头牛吃五天。</div><div class="clip subtitle" id="s1-cap2" data-start="15.4336521" data-duration="4.8369564" data-track-index="5">两次吃掉的总量不同，因为生长的天数也不同。</div><div class="clip subtitle" id="s1-cap3" data-start="20.2706085" data-duration="2.7713915" data-track-index="5">不能把草当作固定的一堆。</div><div class="clip subtitle" id="s1-cap4" data-start="23.742" data-duration="3.4326086" data-track-index="5">先约定一头牛一天吃的草为一份。</div><div class="clip subtitle" id="s1-cap5" data-start="27.1746086" data-duration="6.235391400000001" data-track-index="5">这只是换一个方便的单位，不是在猜一份具体有多少千克。</div><div class="progress" id="s1-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#s1-prompt',{"opacity":0,"x":-55});tl.to('#s1-prompt',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.65);tl.fromTo('#s1-heading',{opacity:0,x:-35},{opacity:1,x:0,duration:.6},0);tl.fromTo('#s1-progress',{scaleX:0},{scaleX:1,duration:34.833333333333336,ease:'none'},0);window.__timelines['s1']=tl;}</script></template></body></html>
