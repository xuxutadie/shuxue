<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"></head><body><template><style>@font-face{font-family:'Microsoft YaHei';src:local('Microsoft YaHei')}*{box-sizing:border-box}body{margin:0}.scene{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#FFF9E9;color:#243047;font-family:'Microsoft YaHei',sans-serif;padding:36px 70px}.head{display:flex;justify-content:space-between;align-items:center;height:56px;font-size:27px;font-weight:700}.tag{padding:10px 22px;border:3px solid #243047;border-radius:17px;background:#B395FF}h1{font-size:56px;line-height:1.2;margin:25px 0 20px}.board{width:1780px;height:687px;display:block;overflow:visible}.subtitle{position:absolute;left:72px;right:72px;bottom:26px;min-height:103px;padding:16px 28px;background:#243047;color:white;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:35px;line-height:1.45}.progress{position:absolute;bottom:0;left:0;width:1920px;height:8px;background:#FF8666;transform-origin:left}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin:0 5px;border:2px solid #243047}.active{background:#243047}</style><div id="s4" data-composition-id="s4" data-width="1920" data-height="1080" data-duration="31.916666666666668"><div class="scene"><div class="head"><span class="tag">第10课 · 先读完整题目</span><span>思维实验室 · 把数学讲明白</span><span><i class="dot active"></i><i class="dot active"></i><i class="dot active"></i><i class="dot active"></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i></span></div><h1 id="s4-heading">平均数，是总量的另一种写法</h1><svg class="board" viewBox="0 0 1760 680" role="img" aria-label="平均数，是总量的另一种写法"><rect x="29" y="25" width="1700" height="405" rx="20" fill="#243047"/><rect x="25" y="20" width="1700" height="405" rx="20" fill="white" stroke="#243047" stroke-width="3"/><text x="65" y="92" fill="#243047" font-size="40" font-weight="600">4个数的平均数是12，其中3个数分别是8、10、15。第四个数是多少？请用总和解释，而</text><text x="65" y="151" fill="#243047" font-size="40" font-weight="600">不是只比较某一个数与12的差。</text><g id="s4-prompt"><rect x="64" y="570" width="1620" height="90" rx="20" fill="#243047"/><rect x="60" y="565" width="1620" height="90" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="90" y="624" fill="#243047" font-size="37" font-weight="600">先读完整条件，圈出已知与所求，再开始分析。</text></g></svg><div class="clip subtitle" id="s4-cap0" data-start="0.75" data-duration="6.5304346" data-track-index="5">平均十二，是说把四个数的总量平均分成四份，每份十二。</div><div class="clip subtitle" id="s4-cap1" data-start="7.2804346" data-duration="3.521565399999999" data-track-index="5">并不是每个原数都必须等于十二。</div><div class="clip subtitle" id="s4-cap2" data-start="11.501999999999999" data-duration="4.9951086" data-track-index="5">所以先由平均数乘个数，找回四个数的总和。</div><div class="clip subtitle" id="s4-cap3" data-start="16.497108599999997" data-duration="4.9368914" data-track-index="5">再扣掉已知的三个数，剩下的就是第四个数。</div><div class="clip subtitle" id="s4-cap4" data-start="22.134" data-duration="8.372" data-track-index="5">我们用四根小柱表示这些数，看看高低不同时，总量怎样通过移动变成平均的高度。</div><div class="progress" id="s4-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#s4-prompt',{"opacity":0,"x":-55});tl.to('#s4-prompt',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.65);tl.fromTo('#s4-heading',{opacity:0,x:-35},{opacity:1,x:0,duration:.6},0);tl.fromTo('#s4-progress',{scaleX:0},{scaleX:1,duration:31.916666666666668,ease:'none'},0);window.__timelines['s4']=tl;}</script></template></body></html>
