一种。</text><g id="s3-note0"><rect x="1044" y="40" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="35" width="680" height="125" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="1065" y="84" fill="#243047" font-size="33" font-weight="600">每家先给2本，用去6本</text></g><g id="s3-note1"><rect x="1044" y="193" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="188" width="680" height="125" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="1065" y="237" fill="#243047" font-size="33" font-weight="600">剩余：9−6＝3本</text></g><g id="s3-note2"><rect x="1044" y="346" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="341" width="680" height="125" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="1065" y="390" fill="#243047" font-size="33" font-weight="600">额外每家0～2本</text></g><g id="s3-note3"><rect x="1044" y="499" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="494" width="680" height="125" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="1065" y="543" fill="#243047" font-size="33" font-weight="600">(0,1,2)的6种＋(1,1,1)</text></g></svg><div class="clip subtitle" id="s3-cap0" data-start="0.75" data-duration="5.8646738" data-track-index="5">也可以先给每家两本，三家共用了六本，还剩三本需要分。</div><div class="clip subtitle" id="s3-cap1" data-start="6.6146738" data-duration="5.1473262" data-track-index="5">每家最多四本，所以额外只能再给零到两本。</div><div class="clip subtitle" id="s3-cap2" data-start="12.462" data-duration="7.676" data-track-index="5">剩下三本的分法，只可能是零、一、二分别给三家，或者每家再给一本。</div><div class="clip subtitle" id="s3-cap3" data-start="20.838" data-duration="5.0494564" data-track-index="5">零、一、二给甲乙丙的顺序不同，有六种安排。</div><div class="clip subtitle" id="s3-cap4" data-start="25.887456399999998" data-duration="4.0905436" data-track-index="5">再加上一、一、一这种，共七种。</div><div class="clip subtitle" id="s3-cap5" data-start="30.678" data-duration="2.359239" data-track-index="5">两种办法结果一致。</div><div class="clip subtitl
