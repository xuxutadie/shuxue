="5">固定甲三本，乙和丙还要六本。</div><div class="clip subtitle" id="s2-cap6" data-start="26.6226086" data-duration="4.915391400000001" data-track-index="5">乙二丙四、乙三丙三、乙四丙二，共三种。</div><div class="clip subtitle" id="s2-cap7" data-start="32.238" data-duration="6.8157607" data-track-index="5">固定甲四本，乙丙还要五本，只有乙二丙三和乙三丙二，共两种。</div><div class="clip subtitle" id="s2-cap8" data-start="39.0537607" data-duration="4.3162392999999994" data-track-index="5">按分类相加，两加三加二，共七种。</div><div class="progress" id="s2-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#s2-row0',{"opacity":0,"x":-100});tl.to('#s2-row0',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},11.354);gsap.set('#s2-row1',{"opacity":0,"x":-100});tl.to('#s2-row1',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},12.553999999999998);gsap.set('#s2-row2',{"opacity":0,"x":-100});tl.to('#s2-row2',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},23.09);gsap.set('#s2-row3',{"opacity":0,"x":-100});tl.to('#s2-row3',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},24.29);gsap.set('#s2-row4',{"opacity":0,"x":100});tl.to('#s2-row4',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},25.49);gsap.set('#s2-row5',{"opacity":0,"x":100});tl.to('#s2-row5',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},32.138);gsap.set('#s2-row6',{"opacity":0,"x":100});tl.to('#s2-row6',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},33.338);gsap.set('#s2-note0',{"opacity":0,"x":55});tl.to('#s2-note0',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.65);gsap.set('#s2-note1',{"opacity":0,"x":55});tl.to('#s2-note1',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},12.354);gsap.set('#s2-note2',{"opa
