art="8.2994563" data-duration="6.1005434" data-track-index="5">枚举关心各份怎样分，平均数关心总量平均分成几份。</div><div class="clip subtitle" id="s5-cap2" data-start="14.3999997" data-duration="10.8020003" data-track-index="5">接着看四个数平均十二、其中三个是八、十、十五：先用十二乘四还原总量四十八，再找缺失的那一份。</div><div class="clip subtitle" id="s5-cap3" data-start="25.902" data-duration="4.125543400000001" data-track-index="5">四十八减三十三，得到第四个数十五。</div><div class="clip subtitle" id="s5-cap4" data-start="30.0275434" data-duration="4.4864565999999995" data-track-index="5">现在四个数是八、十、十五、十五。</div><div class="clip subtitle" id="s5-cap5" data-start="35.214" data-duration="9.884" data-track-index="5">动画把高柱多出的部分移给低柱，总量没有增加也没有减少，最后每柱都是十二，这就是移多补少。</div><div class="clip subtitle" id="s5-cap6" data-start="45.798" data-duration="5.7559781" data-track-index="5">检查八加十加十五加十五等于四十八，除以四等于十二。</div><div class="clip subtitle" id="s5-cap7" data-start="51.5539781" data-duration="5.4240219" data-track-index="5">平均数连接总量与份数，先找总和往往更清楚。</div><div class="progress" id="s5-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});tl.to('#s5-val0',{"duration":0.85,"ease":"power2.inOut","opacity":0},37.114);gsap.set('#s5-avg0',{"opacity":0,"y":24});tl.to('#s5-avg0',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},40.114);tl.to('#s5-val1',{"duration":0.85,"ease":"power2.inOut","opacity":0},37.114);gsap.set('#s5-avg1',{"opacity":0,"y":24});tl.to('#s5-avg1',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},40.114);tl.to('#s5-val2',{"duration":0.85,"ease":"power2.inOut","opacity":0},37.114);gsap.set('#s5-avg2',{"opacity":0,"y":24});tl.to('#s5-avg2',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},40.114);tl.to('#s5-val3',{"duration":0.85,"ease":"power2.inOut","opacity":0},37.114);gsap.set('#s5-avg3',{"opacity":0,"y":24});tl.to('#s5-avg3',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},40.114);tl
