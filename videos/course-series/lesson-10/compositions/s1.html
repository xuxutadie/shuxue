<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"></head><body><template><style>@font-face{font-family:'Microsoft YaHei';src:local('Microsoft YaHei')}*{box-sizing:border-box}body{margin:0}.scene{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#FFF9E9;color:#243047;font-family:'Microsoft YaHei',sans-serif;padding:36px 70px}.head{display:flex;justify-content:space-between;align-items:center;height:56px;font-size:27px;font-weight:700}.tag{padding:10px 22px;border:3px solid #243047;border-radius:17px;background:#B395FF}h1{font-size:56px;line-height:1.2;margin:25px 0 20px}.board{width:1780px;height:687px;display:block;overflow:visible}.subtitle{position:absolute;left:72px;right:72px;bottom:26px;min-height:103px;padding:16px 28px;background:#243047;color:white;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:35px;line-height:1.45}.progress{position:absolute;bottom:0;left:0;width:1920px;height:8px;background:#FF8666;transform-origin:left}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin:0 5px;border:2px solid #243047}.active{background:#243047}</style><div id="s1" data-composition-id="s1" data-width="1920" data-height="1080" data-duration="34.541666666666664"><div class="scene"><div class="head"><span class="tag">第10课 · 先读完整题目</span><span>思维实验室 · 把数学讲明白</span><span><i class="dot active"></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i></span></div><h1 id="s1-heading">不同的书店，能怎样分？</h1><svg class="board" viewBox="0 0 1760 680" role="img" aria-label="不同的书店，能怎样分？"><rect x="29" y="25" width="1700" height="405" rx="20" fill="#243047"/><rect x="25" y="20" width="1700" height="405" rx="20" fill="white" stroke="#243047" stroke-width="3"/><text x="65" y="92" fill="#243047" font-size="40" font-weight="600">把9本相同的书全部分给甲、乙、丙三家书店，每家至少2本、至多4本。按三家书店各得多</text><text x="65" y="151" fill="#243047" font-size="40" font-weight="600">少本区分方案，一共有多少种分配方法？</text><g id="s1-prompt"><rect x="64" y="570" width="1620" height="90" rx="20" fill="#243047"/><rect x="60" y="565" width="1620" height="90" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="90" y="624" fill="#243047" font-size="37" font-weight="600">先读完整条件，圈出已知与所求，再开始分析。</text></g></svg><div class="clip subtitle" id="s1-cap0" data-start="0.75" data-duration="4.451630300000001" data-track-index="5">书本相同，但甲乙丙是三家不同的书店。</div><div class="clip subtitle" id="s1-cap1" data-start="5.201630300000001" data-duration="6.3683697" data-track-index="5">甲两本乙三本丙四本，和甲三本乙两本丙四本，是不同方案。</div><div class="clip subtitle" id="s1-cap2" data-start="12.27" data-duration="5.5385868" data-track-index="5">每家至少两本、最多四本，三家合起来必须九本。</div><div class="clip subtitle" id="s1-cap3" data-start="17.8085868" data-duration="5.8334132" data-track-index="5">把这三个限制同时记下来，不能只凑出总数就算合格。</div><div class="clip subtitle" id="s1-cap4" data-start="24.342000000000002" data-duration="8.780000000000001" data-track-index="5">我们按甲店拿几本分类，每一类再按乙店数量从小到大尝试，最后让丙店补足九本。</div><div class="progress" id="s1-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#s1-prompt',{"opacity":0,"x":-55});tl.to('#s1-prompt',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.65);tl.fromTo('#s1-heading',{opacity:0,x:-35},{opacity:1,x:0,duration:.6},0);tl.fromTo('#s1-progress',{scaleX:0},{scaleX:1,duration:34.541666666666664,ease:'none'},0);window.__timelines['s1']=tl;}</script></template></body></html>
