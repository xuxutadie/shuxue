0" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="1065" y="84" fill="#243047" font-size="33" font-weight="600">4、8、12、16……</text></g><g id="s3-note1"><rect x="1044" y="193" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="188" width="680" height="125" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="1065" y="237" fill="#243047" font-size="33" font-weight="600">6、12、18……</text></g><g id="s3-note2"><rect x="1044" y="346" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="341" width="680" height="125" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="1065" y="390" fill="#243047" font-size="33" font-weight="600">共同到达：12秒</text></g><g id="s3-note3"><rect x="1044" y="499" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="494" width="680" height="125" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="1065" y="543" fill="#243047" font-size="33" font-weight="600">0秒是起点，12秒首次再次</text></g></svg><div class="clip subtitle" id="s3-cap0" data-start="0.75" data-duration="1.5711955999999998" data-track-index="5">再看闪灯。</div><div class="clip subtitle" id="s3-cap1" data-start="2.3211956" data-duration="7.4864129" data-track-index="5">从零秒开始，第一盏每四秒亮一次，会在四、八、十二、十六秒亮。</div><div class="clip subtitle" id="s3-cap2" data-start="9.8076085" data-duration="2.7703915000000006" data-track-index="5">这些时刻是四的倍数。</div><div class="clip subtitle" id="s3-cap3" data-start="13.278" data-duration="5.4298912" data-track-index="5">第二盏每六秒亮一次，会在六、十二、十八秒亮。</div><div class="clip subtitle" id="s3-cap4" data-start="18.7078912" data-duration="6.3741088" data-track-index="5">这些时刻是六的倍数，意思是一个六秒、两个六秒这样累加。</div><div class="clip subtitle" id="s3-cap5" data-start="25.782" data-duration="4.3157607" data-track-index="5">两条时间线第一次在十二秒再次对齐。</div><div class="clip subtitle" id="s3-cap6" data-start="30.0977607" data-duration="6.0242393" data-track-index="5">十二既是四的倍数，也是六的倍数，所以叫它们的公倍数。</div><div class="clip subtitle" id=
