 stroke="#243047" stroke-width="3"/><text x="86" y="187" fill="#243047" font-size="34" font-weight="600">分成相同礼包 → 找共同因数</text></g><g id="s4-b"><rect x="74" y="355" width="815" height="150" rx="20" fill="#243047"/><rect x="70" y="350" width="815" height="150" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="86" y="437" fill="#243047" font-size="34" font-weight="600">间隔再次相遇 → 找共同倍数</text></g><text x="45" y="620" fill="#243047" font-size="32" font-weight="600">先判断数的含义，再看“最多”或“首次”。</text><g id="s4-note0"><rect x="1044" y="40" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="35" width="680" height="125" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="1065" y="84" fill="#243047" font-size="33" font-weight="600">分礼包：袋数同时整除两堆</text></g><g id="s4-note1"><rect x="1044" y="193" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="188" width="680" height="125" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="1065" y="237" fill="#243047" font-size="33" font-weight="600">闪灯：时刻同时是两种间隔的倍数</text></g><g id="s4-note2"><rect x="1044" y="346" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="341" width="680" height="125" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="1065" y="390" fill="#243047" font-size="33" font-weight="600">6是袋数；12是秒数</text></g><g id="s4-note3"><rect x="1044" y="499" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="494" width="680" height="125" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="1065" y="543" fill="#243047" font-size="33" font-weight="600">先判断关系，再选择方法</text></g></svg><div class="clip subtitle" id="s4-cap0" data-start="0.75" data-duration="2.5766302999999997" data-track-index="5">礼包答案六表示袋数。</div><div class="clip subtitle" id="s4-cap1" data-start="3.3266302999999997" data-duration="7.6193697" data-track-index="5">十二除以六是二，十八除以六是三，都能装成整数个水果，条件成立。</div><div class="clip subtitle" id="s4-cap2" data-start="11.645999999999999" data-duration="2.9706521" data-track-index="5">闪灯答案十二表示秒数。</div><div class="clip subtitle" id="s4-cap3" data-start="14.6166521" data-duration="6.6013479" data-track-index="5">十二是三个四秒，也正好是两个六秒，两盏灯在这个时刻都亮。</div><div class="clip subtitle" id="s4-cap4" data-start="21.918000000000003" data-duration="9.908" data-track-index="5">如果把闪灯答案写成二秒，虽然二是四和六的公因数，但二秒时两盏灯都没亮，所以答错了问题。</div><div class="clip subtitle" id="s4-cap5" data-start="32.526" data-duration="7.0059781" data-track-index="5">先问自己：是把现有数量平均分开，还是让两个间隔往前走到一起？</div><div class="clip subtitle" id="s4-cap6" data-start="39.5319781" data-duration="2.566021900000001" data-track-index="5">名称由数量关系决定。</div><div class="progress" id="s4-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});tl.to('#s4-a',{"duration":0.4,"ease":"power2.inOut","scale":1.035,"transformOrigin":"50% 50%","yoyo":true,"repeat":1},1.65);tl.to('#s4-b',{"duration":0.4,"ease":"power2.inOut","scale":1.035,"transformOrigin":"50% 50%","yoyo":true,"repeat":1},12.546);gsap.set('#s4-note0',{"opacity":0,"x":55});tl.to('#s4-note0',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.65);gsap.set('#s4-note1',{"opacity":0,"x":55});tl.to('#s4-note1',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},12.546);gsap.set('#s4-note2',{"opacity":0,"x":55});tl.to('#s4-note2',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},22.818);gsap.set('#s4-note3',{"opacity":0,"x":55});tl.to('#s4-note3',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},33.426);tl.fromTo('#s4-heading',{opacity:0,x:-35},{opacity:1,x:0,duration:.6},0);tl.fromTo('#s4-progress',{scaleX:0},{scaleX:1,duration:43.5,ease:'none'},0);window.__timelines['s4']=tl;}</script></template></body></html>
