ke="#243047" stroke-width="3"/><text x="1065" y="237" fill="#243047" font-size="33" font-weight="600">循环位置 → 余数：方形</text></g><g id="s2-note2"><rect x="1044" y="346" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="341" width="680" height="125" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="1065" y="390" fill="#243047" font-size="33" font-weight="600">平均×份数 → 总量：14分</text></g><g id="s2-note3"><rect x="1044" y="499" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="494" width="680" height="125" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="1065" y="543" fill="#243047" font-size="33" font-weight="600">方法由数量关系决定</text></g></svg><div class="clip subtitle" id="s2-cap0" data-start="0.75" data-duration="5.8646738" data-track-index="5">第一问的包数，要同时把两种卡片整分，而且不能剩。</div><div class="clip subtitle" id="s2-cap1" data-start="6.6146738" data-duration="6.803326200000001" data-track-index="5">包数必须是二十四和三十二的共同因数，所以选最大可行的八包。</div><div class="clip subtitle" id="s2-cap2" data-start="14.118" data-duration="5.7967390000000005" data-track-index="5">第二问的二十六是位置序号，不是要平均分掉的图案总数。</div><div class="clip subtitle" id="s2-cap3" data-start="19.914739" data-duration="5.215261" data-track-index="5">三个一组，二十六除以三余二，因此落在方形。</div><div class="clip subtitle" id="s2-cap4" data-start="25.830000000000002" data-duration="10.148" data-track-index="5">第三问给的是四次的平均值，先乘四还原总分四十四，再减前三次三十，得到第,四次十四分。</div><div class="clip subtitle" id="s2-cap5" data-start="36.678000000000004" data-duration="3.7994564" data-track-index="5">同样出现除法，理由可能完全不同。</div><div class="clip subtitle" id="s2-cap6" data-start="40.4774564" data-duration="8.7725436" data-track-index="5">先说清要找的是组数、位置，还是每份水平，就不容易被关键词或熟悉的数字带偏。</div><div class="progress" id="s2-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#s2-arrow0',{"opacity":0,"y":24});tl.to('#s2-arrow0',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.65);
