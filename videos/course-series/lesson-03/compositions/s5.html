y="151" fill="#243047" font-size="40" font-weight="600">少？这里一次加法或一次减法，都算1次操作。</text><g id="s5-prompt"><rect x="64" y="570" width="1620" height="90" rx="20" fill="#243047"/><rect x="60" y="565" width="1620" height="90" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="90" y="624" fill="#243047" font-size="37" font-weight="600">先读完整条件，圈出已知与所求，再开始分析。</text></g></svg><div class="clip subtitle" id="s5-cap0" data-start="0.75" data-duration="5.2532607" data-track-index="5">这次重复的不是颜色，而是加四、减一两步操作。</div><div class="clip subtitle" id="s5-cap1" data-start="6.0032607" data-duration="4.7267393" data-track-index="5">注意两步才组成一组，不是一整组算一次操作。</div><div class="clip subtitle" id="s5-cap2" data-start="11.43" data-duration="4.139130300000001" data-track-index="5">第一步十变十四，第二步十四变十三。</div><div class="clip subtitle" id="s5-cap3" data-start="15.569130300000001" data-duration="2.8804346999999995" data-track-index="5">一组操作总共增加三。</div><div class="clip subtitle" id="s5-cap4" data-start="18.449565" data-duration="5.048435" data-track-index="5">第三步再加四，第四步再减一，仍然净增三。</div><div class="clip subtitle" id="s5-cap5" data-start="24.198" data-duration="3.921739" data-track-index="5">七次操作能完成三组，还多一次。</div><div class="clip subtitle" id="s5-cap6" data-start="28.119739" data-duration="5.026261" data-track-index="5">先计算完整组造成的变化，再处理最后那一次。</div><div class="progress" id="s5-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#s5-prompt',{"opacity":0,"x":-55});tl.to('#s5-prompt',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.65);tl.fromTo('#s5-heading',{opacity:0,x:-35},{opacity:1,x:0,duration:.6},0);tl.fromTo('#s5-progress',{scaleX:0},{scaleX:1,duration:34.583333333333336,ease:'none'},0);window.__timelines['s5']=tl;}</script></template></body></html>
