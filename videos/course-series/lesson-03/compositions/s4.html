="20" fill="#243047"/><rect x="80" y="125" width="145" height="86" rx="20" fill="#FF8666" stroke="#243047" stroke-width="3"/><text x="96" y="180" fill="#243047" font-size="34" font-weight="600">红</text></g><text x="123" y="247" fill="#243047" font-size="28" font-weight="600">第1位</text><g id="s4-car01"><rect x="304" y="130" width="145" height="86" rx="20" fill="#243047"/><rect x="300" y="125" width="145" height="86" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="316" y="180" fill="#243047" font-size="34" font-weight="600">黄</text></g><text x="343" y="247" fill="#243047" font-size="28" font-weight="600">第2位</text><g id="s4-car02"><rect x="524" y="130" width="145" height="86" rx="20" fill="#243047"/><rect x="520" y="125" width="145" height="86" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="536" y="180" fill="#243047" font-size="34" font-weight="600">蓝</text></g><text x="563" y="247" fill="#243047" font-size="28" font-weight="600">第3位</text><g id="s4-car03"><rect x="744" y="130" width="145" height="86" rx="20" fill="#243047"/><rect x="740" y="125" width="145" height="86" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="756" y="180" fill="#243047" font-size="34" font-weight="600">绿</text></g><text x="783" y="247" fill="#243047" font-size="28" font-weight="600">第4位</text><g id="s4-ring"><rect x="70" y="115" width="165" height="106" rx="24" fill="none" stroke="#243047" stroke-width="6"/></g><g id="s4-tail"><rect x="114" y="380" width="730" height="84" rx="20" fill="#243047"/><rect x="110" y="375" width="730" height="84" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="126" y="429" fill="#243047" font-size="34" font-weight="600">第28节：第7组的最后一节</text></g><g id="s4-next"><text x="120" y="550" fill="#243047" font-size="38" font-weight="600">第29节，才回到下一组的红色</text></g><g id="s4-note0"><rect x="1044" y="40" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="35" width="680" height="125" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="1065" y="84" fill="#243047" font-size="33" font-weight="600">28＝4×7</text></g><g id="s4-note1"><rect x="1044" y="193" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="188" width="680" height="125" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="1065" y="237" fill="#243047" font-size="33" font-weight="600">余0：正好在组尾</text></g><g id="s4-note2"><rect x="1044" y="346" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="341" width="680" height="125" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="1065" y="390" fill="#243047" font-size="33" font-weight="600">第28节：绿色</text></g><g id="s4-note3"><rect x="1044" y="499" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="494" width="680" height="125" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="1065" y="543" fill="#243047" font-size="33" font-weight="600">第29节：下一组第1位</text></g></svg><div class="clip subtitle" id="s4-cap0" data-start="0.75" data-duration="3.7722824999999998" data-track-index="5">二十八除以四，商七，没有余数。</div><div class="clip subtitle" id="s4-cap1" data-start="4.5222825" data-duration="6.3997175" data-track-index="5">这表示正好装满七个完整的组，最后一节在第七组的末尾。</div><div class="clip subtitle" id="s4-cap2" data-start="11.622" data-duration="2.3184782" data-track-index="5">末尾是第四位绿色。</div><div class="clip subtitle" id="s4-cap3" data-start="13.940478200000001" data-duration="5.5975218" data-track-index="5">余数零不代表第零种颜色，更不代表重新回到第一位。</div><div class="clip subtitle" id="s4-cap4" data-start="20.238000000000003" data-duration="6.5032607" data-track-index="5">请观察光圈，第二十八节停在绿色，第二十九节才回到红色。</div><div class="clip subtitle" id="s4-cap5" data-start="26.7412607" data-duration="4.9167393" data-track-index="5">先后两节只差一步，颜色却跨过了组的边界。</div><div class="clip subtitle" id="s4-cap6" data-start="32.358000000000004" data-duration="8.852" data-track-index="5">遇到整除时，可以先用第四节、第八节这样的小例子检查：它们都是绿色，规律就很清楚了。</div><div class="progress" id="s4-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});tl.to('#s4-ring',{"duration":0.85,"ease":"power2.inOut","x":660},1.05);gsap.set('#s4-tail',{"opacity":0,"y":24});tl.to('#s4-tail',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},2.65);gsap.set('#s4-next',{"opacity":0,"y":24});tl.to('#s4-next',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},23.138);tl.to('#s4-ring',{"duration":0.85,"ease":"power2.inOut","x":0},23.138);gsap.set('#s4-note0',{"opacity":0,"x":55});tl.to('#s4-note0',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.65);gsap.set('#s4-note1',{"opacity":0,"x":55});tl.to('#s4-note1',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},12.522);gsap.set('#s4-note2',{"opacity":0,"x":55});tl.to('#s4-note2',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},21.138);gsap.set('#s4-note3',{"opacity":0,"x":55});tl.to('#s4-note3',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},33.258);tl.fromTo('#s4-heading',{opacity:0,x:-35},{opacity:1,x:0,duration:.6},0);tl.fromTo('#s4-progress',{scaleX:0},{scaleX:1,duration:42.625,ease:'none'},0);window.__timelines['s4']=tl;}</script></template></body></html>
