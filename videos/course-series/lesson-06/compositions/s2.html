45C7FF" stroke="#243047" stroke-width="4"/></g><text x="375" y="97" fill="#243047" font-size="31" font-weight="600">8厘米</text><text x="30" y="325" fill="#243047" font-size="31" font-weight="600">6厘米</text><text x="550" y="150" fill="#243047" font-size="27" font-weight="600">2厘米</text><g id="s2-corner"><rect x="540" y="115" width="140" height="140" fill="#FF8666" stroke="#243047" stroke-width="3"/></g><text x="45" y="620" fill="#243047" font-size="32" font-weight="600">8×6 − 2×2 ＝ 44 平方厘米</text><g id="s2-note0"><rect x="1044" y="40" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="35" width="680" height="125" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="1065" y="84" fill="#243047" font-size="33" font-weight="600">整体：8×6＝48</text></g><g id="s2-note1"><rect x="1044" y="193" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="188" width="680" height="125" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="1065" y="237" fill="#243047" font-size="33" font-weight="600">缺角：2×2＝4</text></g><g id="s2-note2"><rect x="1044" y="346" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="341" width="680" height="125" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="1065" y="390" fill="#243047" font-size="33" font-weight="600">剩余：48−4＝44</text></g><g id="s2-note3"><rect x="1044" y="499" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="494" width="680" height="125" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="1065" y="543" fill="#243047" font-size="33" font-weight="600">单位：平方厘米</text></g></svg><div class="clip subtitle" id="s2-cap0" data-start="0.75" data-duration="3.1608695" data-track-index="5">看图，虚线标出剪去的角。</div><div class="clip subtitle" id="s2-cap1" data-start="3.9108695" data-duration="6.747130499999999" data-track-index="5">让这块小正方形回到原位，外框就恢复成长八宽六的长方形。</div><div class="clip subtitle" id="s2-cap2" data-start="11.357999999999999" data-duration="5.307608500000001" data-track-index="5">完整长方形面积是八乘六，等于四十八平方厘米。</div><div class="clip subtitle" id="s2-cap3" data-start="16.665608499999998" data-duration="3.4243915000000005" data-track-index="5">可是其中包含了刚刚补回来的那块。</div><div class="clip subtitle" id="s2-cap4" data-start="20.790000000000003" data-duration="6.0005433" data-track-index="5">缺角边长两厘米，所以面积是二乘二，等于四平方厘米。</div><div class="clip subtitle" id="s2-cap5" data-start="26.790543300000003" data-duration="3.4754567000000005" data-track-index="5">不能只减去二，因为二是长度。</div><div class="clip subtitle" id="s2-cap6" data-start="30.966" data-duration="4.5874999" data-track-index="5">从四十八中减去四，得到四十四平方厘米。</div><div class="clip subtitle" id="s2-cap7" data-start="35.5534999" data-duration="5.3925001" data-track-index="5">动画让缺角退出，剩下的部分才是题目要的面积。</div><div class="progress" id="s2-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#s2-corner',{"opacity":0,"x":100,"y":-60});tl.to('#s2-corner',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},3.65);tl.to('#s2-corner',{"duration":0.85,"ease":"power2.inOut","opacity":0.08,"x":70,"y":-45},32.866);gsap.set('#s2-note0',{"opacity":0,"x":55});tl.to('#s2-note0',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.65);gsap.set('#s2-note1',{"opacity":0,"x":55});tl.to('#s2-note1',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},12.258);gsap.set('#s2-note2',{"opacity":0,"x":55});tl.to('#s2-note2',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},21.69);gsap.set('#s2-note3',{"opacity":0,"x":55});tl.to('#s2-note3',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},31.866);tl.fromTo('#s2-heading',{opacity:0,x:-35},{opacity:1,x:0,duration:.6},0);tl.fromTo('#s2-progress',{scaleX:0},{scaleX:1,duration:42.375,ease:'none'},0);window.__timelines['s2']=tl;}</script></template></body></html>
