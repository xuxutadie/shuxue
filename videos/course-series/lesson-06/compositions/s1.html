<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"></head><body><template><style>@font-face{font-family:'Microsoft YaHei';src:local('Microsoft YaHei')}*{box-sizing:border-box}body{margin:0}.scene{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#FFF9E9;color:#243047;font-family:'Microsoft YaHei',sans-serif;padding:36px 70px}.head{display:flex;justify-content:space-between;align-items:center;height:56px;font-size:27px;font-weight:700}.tag{padding:10px 22px;border:3px solid #243047;border-radius:17px;background:#B395FF}h1{font-size:56px;line-height:1.2;margin:25px 0 20px}.board{width:1780px;height:687px;display:block;overflow:visible}.subtitle{position:absolute;left:72px;right:72px;bottom:26px;min-height:103px;padding:16px 28px;background:#243047;color:white;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:35px;line-height:1.45}.progress{position:absolute;bottom:0;left:0;width:1920px;height:8px;background:#FF8666;transform-origin:left}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin:0 5px;border:2px solid #243047}.active{background:#243047}</style><div id="s1" data-composition-id="s1" data-width="1920" data-height="1080" data-duration="39.333333333333336"><div class="scene"><div class="head"><span class="tag">第6课 · 先读完整题目</span><span>思维实验室 · 把数学讲明白</span><span><i class="dot active"></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i></span></div><h1 id="s1-heading">剪去一个角，剩下多大？</h1><svg class="board" viewBox="0 0 1760 680" role="img" aria-label="剪去一个角，剩下多大？"><rect x="29" y="25" width="1700" height="405" rx="20" fill="#243047"/><rect x="25" y="20" width="1700" height="405" rx="20" fill="white" stroke="#243047" stroke-width="3"/><text x="65" y="92" fill="#243047" font-size="40" font-weight="600">一张长8厘米、宽6厘米的长方形纸，从右上角剪去一个边长2厘米的正方形。剩下纸片的面</text><text x="65" y="151" fill="#243047" font-size="40" font-weight="600">积是多少平方厘米？请用两种方法计算。</text><g id="s1-prompt"><rect x="64" y="570" width="1620" height="90" rx="20" fill="#243047"/><rect x="60" y="565" width="1620" height="90" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="90" y="624" fill="#243047" font-size="37" font-weight="600">先读完整条件，圈出已知与所求，再开始分析。</text></g></svg><div class="clip subtitle" id="s1-cap0" data-start="0.75" data-duration="2.6581521" data-track-index="5">先把完整条件读清楚。</div><div class="clip subtitle" id="s1-cap1" data-start="3.4081521" data-duration="6.7798912" data-track-index="5">外框长八厘米、宽六厘米，右上角缺的是边长两厘米的正方形。</div><div class="clip subtitle" id="s1-cap2" data-start="10.1880433" data-duration="3.2299567000000007" data-track-index="5">要求的是剩下部分的面积。</div><div class="clip subtitle" id="s1-cap3" data-start="14.118" data-duration="5.3483694" data-track-index="5">面积是在问图形占多大的平面，不是绕一圈有多长。</div><div class="clip subtitle" id="s1-cap4" data-start="19.4663694" data-duration="6.383630600000001" data-track-index="5">标注的八、六、二都是长度，需要经过计算才得到面积。</div><div class="clip subtitle" id="s1-cap5" data-start="26.55" data-duration="5.1717390000000005" data-track-index="5">这个形状虽然不规则，但它来自一个熟悉的长方形。</div><div class="clip subtitle" id="s1-cap6" data-start="31.721739" data-duration="6.176261" data-track-index="5">我们可以把缺角补回来，也可以把剩下部分切成两个长方形。</div><div class="progress" id="s1-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#s1-prompt',{"opacity":0,"x":-55});tl.to('#s1-prompt',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.65);tl.fromTo('#s1-heading',{opacity:0,x:-35},{opacity:1,x:0,duration:.6},0);tl.fromTo('#s1-progress',{scaleX:0},{scaleX:1,duration:39.333333333333336,ease:'none'},0);window.__timelines['s1']=tl;}</script></template></body></html>
