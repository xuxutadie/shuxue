<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"></head><body><template><style>@font-face{font-family:'Microsoft YaHei';src:local('Microsoft YaHei')}*{box-sizing:border-box}body{margin:0}.scene{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#FFF9E9;color:#243047;font-family:'Microsoft YaHei',sans-serif;padding:36px 70px}.head{display:flex;justify-content:space-between;align-items:center;height:56px;font-size:27px;font-weight:700}.tag{padding:10px 22px;border:3px solid #243047;border-radius:17px;background:#B395FF}h1{font-size:56px;line-height:1.2;margin:25px 0 20px}.board{width:1780px;height:687px;display:block;overflow:visible}.subtitle{position:absolute;left:72px;right:72px;bottom:26px;min-height:103px;padding:16px 28px;background:#243047;color:white;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:35px;line-height:1.45}.progress{position:absolute;bottom:0;left:0;width:1920px;height:8px;background:#FF8666;transform-origin:left}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin:0 5px;border:2px solid #243047}.active{background:#243047}</style><div id="s4" data-composition-id="s4" data-width="1920" data-height="1080" data-duration="43.666666666666664"><div class="scene"><div class="head"><span class="tag">第6课 · 跟着图形想一想</span><span>思维实验室 · 把数学讲明白</span><span><i class="dot active"></i><i class="dot active"></i><i class="dot active"></i><i class="dot active"></i><i class="dot "></i><i class="dot "></i><i class="dot "></i><i class="dot "></i></span></div><h1 id="s4-heading">三角形为什么要除以2？</h1><svg class="board" viewBox="0 0 1760 680" role="img" aria-label="三角形为什么要除以2？"><rect x="14" y="17" width="980" height="650" rx="20" fill="#243047"/><rect x="10" y="12" width="980" height="650" rx="20" fill="white" stroke="#243047" stroke-width="3"/><text x="45" y="70" fill="#243047" font-size="38" font-weight="600">底与高，一定要互相对应</text><g id="s4-base"><path d="M100 465H900" fill="none" stroke="#243047" stroke-width="4" stroke-linecap="round"/></g><g id="s4-upper"><path d="M100 165H900" fill="none" stroke="#B395FF" stroke-width="3" stroke-linecap="round"/></g><g id="s4-tri"><polygon points="170,465 710,465 440,165" fill="#FFD43B" stroke="#243047" stroke-width="4"/></g><g id="s4-height"><path d="M440 165V465" fill="none" stroke="#243047" stroke-width="3" stroke-linecap="round"/></g><text x="460" y="330" fill="#243047" font-size="32" font-weight="600">高4厘米</text><text x="335" y="535" fill="#243047" font-size="34" font-weight="600">底6厘米</text><g id="s4-copy"><polygon points="440,165 980,165 710,465" fill="#45C7FF" stroke="#243047" stroke-width="4"/></g><text x="45" y="620" fill="#243047" font-size="32" font-weight="600">相同的两块拼成整体，一个只占一半。</text><g id="s4-note0"><rect x="1044" y="40" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="35" width="680" height="125" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="1065" y="84" fill="#243047" font-size="33" font-weight="600">底：6厘米；垂直高：4厘米</text></g><g id="s4-note1"><rect x="1044" y="193" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="188" width="680" height="125" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="1065" y="237" fill="#243047" font-size="33" font-weight="600">两个相同三角形拼成平行四边形</text></g><g id="s4-note2"><rect x="1044" y="346" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="341" width="680" height="125" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="1065" y="390" fill="#243047" font-size="33" font-weight="600">6×4＝24</text></g><g id="s4-note3"><rect x="1044" y="499" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="494" width="680" height="125" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="1065" y="543" fill="#243047" font-size="33" font-weight="600">一个：24÷2＝12平方厘米</text></g></svg><div class="clip subtitle" id="s4-cap0" data-start="0.75" data-duration="4.1798912" data-track-index="5">换看一个底六厘米、高四厘米的三角形。</div><div class="clip subtitle" id="s4-cap1" data-start="4.9298912" data-duration="5.7041088" data-track-index="5">这里的高必须垂直于所选的底，斜边不能随便拿来当高。</div><div class="clip subtitle" id="s4-cap2" data-start="11.334" data-duration="9.356" data-track-index="5">复制一个完全相同的三角形，旋转后拼到旁边，两块正好形成底六、高四的平行四边形。</div><div class="clip subtitle" id="s4-cap3" data-start="21.39" data-duration="3.9353260000000003" data-track-index="5">拼成的面积是六乘四，等于二十四。</div><div class="clip subtitle" id="s4-cap4" data-start="25.325326" data-duration="7.004673999999999" data-track-index="5">原来的三角形只占其中一半，所以还要除以二，得到十二平方厘米。</div><div class="clip subtitle" id="s4-cap5" data-start="33.03" data-duration="9.212" data-track-index="5">除以二不是口诀里多出来的一步，而是因为两个完全相同的三角形合起来，才有那一整个面积。</div><div class="progress" id="s4-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#s4-copy',{"opacity":0,"x":-270,"y":300,"rotation":180});tl.to('#s4-copy',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},12.234);gsap.set('#s4-note0',{"opacity":0,"x":55});tl.to('#s4-note0',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.65);gsap.set('#s4-note1',{"opacity":0,"x":55});tl.to('#s4-note1',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},12.234);gsap.set('#s4-note2',{"opacity":0,"x":55});tl.to('#s4-note2',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},22.29);gsap.set('#s4-note3',{"opacity":0,"x":55});tl.to('#s4-note3',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},33.93);tl.fromTo('#s4-heading',{opacity:0,x:-35},{opacity:1,x:0,duration:.6},0);tl.fromTo('#s4-progress',{scaleX:0},{scaleX:1,duration:43.666666666666664,ease:'none'},0);window.__timelines['s4']=tl;}</script></template></body></html>
