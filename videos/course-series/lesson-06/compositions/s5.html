<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"></head><body><template><style>@font-face{font-family:'Microsoft YaHei';src:local('Microsoft YaHei')}*{box-sizing:border-box}body{margin:0}.scene{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#FFF9E9;color:#243047;font-family:'Microsoft YaHei',sans-serif;padding:36px 70px}.head{display:flex;justify-content:space-between;align-items:center;height:56px;font-size:27px;font-weight:700}.tag{padding:10px 22px;border:3px solid #243047;border-radius:17px;background:#B395FF}h1{font-size:56px;line-height:1.2;margin:25px 0 20px}.board{width:1780px;height:687px;display:block;overflow:visible}.subtitle{position:absolute;left:72px;right:72px;bottom:26px;min-height:103px;padding:16px 28px;background:#243047;color:white;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:35px;line-height:1.45}.progress{position:absolute;bottom:0;left:0;width:1920px;height:8px;background:#FF8666;transform-origin:left}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin:0 5px;border:2px solid #243047}.active{background:#243047}</style><div id="s5" data-composition-id="s5" data-width="1920" data-height="1080" data-duration="43.958333333333336"><div class="scene"><div class="head"><span class="tag">第6课 · 跟着图形想一想</span><span>思维实验室 · 把数学讲明白</span><span><i class="dot active"></i><i class="dot active"></i><i class="dot active"></i><i class="dot active"></i><i class="dot active"></i><i class="dot "></i><i class="dot "></i><i class="dot "></i></span></div><h1 id="s5-heading">顶点移动，面积为什么不变？</h1><svg class="board" viewBox="0 0 1760 680" role="img" aria-label="顶点移动，面积为什么不变？"><rect x="14" y="17" width="980" height="650" rx="20" fill="#243047"/><rect x="10" y="12" width="980" height="650" rx="20" fill="white" stroke="#243047" stroke-width="3"/><text x="45" y="70" fill="#243047" font-size="38" font-weight="600">底与高，一定要互相对应</text><g id="s5-base"><path d="M100 465H900" fill="none" stroke="#243047" stroke-width="4" stroke-linecap="round"/></g><g id="s5-upper"><path d="M100 165H900" fill="none" stroke="#B395FF" stroke-width="3" stroke-linecap="round"/></g><g id="s5-tri"><polygon points="170,465 710,465 440,165" fill="#FFD43B" stroke="#243047" stroke-width="4"/></g><g id="s5-height"><path d="M440 165V465" fill="none" stroke="#243047" stroke-width="3" stroke-linecap="round"/></g><text x="460" y="330" fill="#243047" font-size="32" font-weight="600">高4厘米</text><text x="335" y="535" fill="#243047" font-size="34" font-weight="600">底6厘米</text><text x="45" y="620" fill="#243047" font-size="32" font-weight="600">上方顶点沿平行线移动，垂直高度不变。</text><g id="s5-note0"><rect x="1044" y="40" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="35" width="680" height="125" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="1065" y="84" fill="#243047" font-size="33" font-weight="600">底始终6厘米</text></g><g id="s5-note1"><rect x="1044" y="193" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="188" width="680" height="125" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="1065" y="237" fill="#243047" font-size="33" font-weight="600">垂直高始终4厘米</text></g><g id="s5-note2"><rect x="1044" y="346" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="341" width="680" height="125" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="1065" y="390" fill="#243047" font-size="33" font-weight="600">6×4÷2＝12</text></g><g id="s5-note3"><rect x="1044" y="499" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="494" width="680" height="125" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="1065" y="543" fill="#243047" font-size="33" font-weight="600">形状改变，面积保持不变</text></g></svg><div class="clip subtitle" id="s5-cap0" data-start="0.75" data-duration="5.919021600000001" data-track-index="5">固定下面六厘米的底，让三角形顶点沿上面的水平线移动。</div><div class="clip subtitle" id="s5-cap1" data-start="6.669021600000001" data-duration="5.8129784" data-track-index="5">顶点虽然换了位置，到底边的垂直距离始终是四厘米。</div><div class="clip subtitle" id="s5-cap2" data-start="13.182" data-duration="8.492" data-track-index="5">动画里三角形变斜了，但底和高都没有变，算式仍然六乘四除以二，面积仍是十二。</div><div class="clip subtitle" id="s5-cap3" data-start="22.374000000000002" data-duration="3.7858693999999997" data-track-index="5">所以同底等高的三角形面积相等。</div><div class="clip subtitle" id="s5-cap4" data-start="26.1598694" data-duration="5.7621306" data-track-index="5">这并不是说形状一样，而是在说决定面积的底和高一样。</div><div class="clip subtitle" id="s5-cap5" data-start="32.622" data-duration="5.1717390000000005" data-track-index="5">观察图形题时，别只凭看起来胖或瘦来猜大小。</div><div class="clip subtitle" id="s5-cap6" data-start="37.793739" data-duration="4.760261" data-track-index="5">把底和对应的高找出来，才能作出可靠判断。</div><div class="progress" id="s5-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});tl.to('#s5-tri polygon',{"duration":3,"ease":"power2.inOut","attr":{"points":"170,465 710,465 780,165"}},2.65);tl.to('#s5-height',{"duration":3,"ease":"power2.inOut","x":340},2.65);tl.to('#s5-tri polygon',{"duration":3,"ease":"power2.inOut","attr":{"points":"170,465 710,465 310,165"}},15.082);tl.to('#s5-height',{"duration":3,"ease":"power2.inOut","x":-130},15.082);gsap.set('#s5-note0',{"opacity":0,"x":55});tl.to('#s5-note0',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.65);gsap.set('#s5-note1',{"opacity":0,"x":55});tl.to('#s5-note1',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},14.082);gsap.set('#s5-note2',{"opacity":0,"x":55});tl.to('#s5-note2',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},23.274);gsap.set('#s5-note3',{"opacity":0,"x":55});tl.to('#s5-note3',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},33.522);tl.fromTo('#s5-heading',{opacity:0,x:-35},{opacity:1,x:0,duration:.6},0);tl.fromTo('#s5-progress',{scaleX:0},{scaleX:1,duration:43.958333333333336,ease:'none'},0);window.__timelines['s5']=tl;}</script></template></body></html>
