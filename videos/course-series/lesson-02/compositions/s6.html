ext x="168" y="526" fill="#243047" font-size="32" font-weight="600">5套＝75克 → 1套＝15克</text></g><g id="s6-four"><text x="160" y="620" fill="#243047" font-size="38" font-weight="600">目标4套：15×4＝60克</text></g><g id="s6-note0"><rect x="1044" y="40" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="35" width="680" height="125" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="1065" y="84" fill="#243047" font-size="33" font-weight="600">合并：5大＋5小＝75克</text></g><g id="s6-note1"><rect x="1044" y="193" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="188" width="680" height="125" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="1065" y="237" fill="#243047" font-size="33" font-weight="600">一套：75÷5＝15克</text></g><g id="s6-note2"><rect x="1044" y="346" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="341" width="680" height="125" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="1065" y="390" fill="#243047" font-size="33" font-weight="600">四套：15×4＝60克</text></g><g id="s6-note3"><rect x="1044" y="499" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="494" width="680" height="125" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="1065" y="543" fill="#243047" font-size="33" font-weight="600">先看所求，再选合并或消去</text></g></svg><div class="clip subtitle" id="s6-cap0" data-start="0.75" data-duration="8.828000000000001" data-track-index="5">把两行合起来，大零件共有五个，小零件也有五个，总重三十七加三十八，等于七十五克。</div><div class="clip subtitle" id="s6-cap1" data-start="10.278" data-duration="5.620108500000001" data-track-index="5">五大五小，可以一大配一小，分成五套完全相同的组合。</div><div class="clip subtitle" id="s6-cap2" data-start="15.898108500000001" data-duration="4.479891499999999" data-track-index="5">一套的重量是七十五除以五，等于十五克。</div><div class="clip subtitle" id="s6-cap3" data-start="21.078000000000003" data-duration="6.2586955" data-track-index="5">题目要求四大四小，就是四套，所以十五乘四，等于六十克。</div><div class="clip subtitle" id="s6-cap4" data-start="27.3366955" data-duration="4.8253045" data-track-index="5">我们没有分别求出单个重量，也已经回答了题目。</div><div class="clip subtitle" id="s6-cap5" data-start="32.862" data-duration="3.6635868" data-track-index="5">整体法不是随便把两个式子相加。</div><div class="clip subtitle" id="s6-cap6" data-start="36.5255868" data-duration="5.774456499999999" data-track-index="5">只有合成的数量比例与所求一致，才能这样按套数缩放。</div><div class="clip subtitle" id="s6-cap7" data-start="42.3000433" data-duration="4.0459567" data-track-index="5">如果问四大三小，就不能把它当四套。</div><div class="progress" id="s6-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});tl.to('#s6-small0',{"duration":1.3,"ease":"power2.inOut","x":35,"y":-90},11.178);gsap.set('#s6-set0',{"opacity":0});tl.to('#s6-set0',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},12.178);tl.to('#s6-small1',{"duration":1.3,"ease":"power2.inOut","x":35,"y":-90},11.378);gsap.set('#s6-set1',{"opacity":0});tl.to('#s6-set1',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},12.378);tl.to('#s6-small2',{"duration":1.3,"ease":"power2.inOut","x":35,"y":-90},11.578000000000001);gsap.set('#s6-set2',{"opacity":0});tl.to('#s6-set2',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},12.578000000000001);tl.to('#s6-small3',{"duration":1.3,"ease":"power2.inOut","x":35,"y":-90},11.778);gsap.set('#s6-set3',{"opacity":0});tl.to('#s6-set3',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},12.778);tl.to('#s6-small4',{"duration":1.3,"ease":"power2.inOut","x":35,"y":-90},11.978000000000002);gsap.set('#s6-set4',{"opacity":0});tl.to('#s6-set4',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},12.978000000000002);gsap.set('#s6-sum',{"opacity":0,"y":24});tl.to('#s6-sum',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},14.178);tl.to('#s6-set4',{"duration":
