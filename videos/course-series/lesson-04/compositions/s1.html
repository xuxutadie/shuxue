y="151" fill="#243047" font-size="40" font-weight="600">请有顺序地找全，并把24写成质数相乘的形式。</text><g id="s1-prompt"><rect x="64" y="570" width="1620" height="90" rx="20" fill="#243047"/><rect x="60" y="565" width="1620" height="90" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="90" y="624" fill="#243047" font-size="37" font-weight="600">先读完整条件，圈出已知与所求，再开始分析。</text></g></svg><div class="clip subtitle" id="s1-cap0" data-start="0.75" data-duration="4.9543477000000005" data-track-index="5">题目要求每袋一样多，而且二十四个全部装完。</div><div class="clip subtitle" id="s1-cap1" data-start="5.7043477000000005" data-duration="4.953652299999999" data-track-index="5">每袋六个可以，每袋五个会剩四个，就不符合。</div><div class="clip subtitle" id="s1-cap2" data-start="11.357999999999999" data-duration="4.791304200000001" data-track-index="5">能把一个正整数整除的正整数，叫作它的因数。</div><div class="clip subtitle" id="s1-cap3" data-start="16.1493042" data-duration="5.788695799999999" data-track-index="5">我们先从装袋理解因数，再研究哪些数还能继续拆分。</div><div class="clip subtitle" id="s1-cap4" data-start="22.638" data-duration="4.0168477000000005" data-track-index="5">找全所有可能时，不能想到一个写一个。</div><div class="clip subtitle" id="s1-cap5" data-start="26.6548477" data-duration="6.2511523" data-track-index="5">让每袋数量从小到大变化，同时记录袋数，会更有条理。</div><div class="progress" id="s1-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#s1-prompt',{"opacity":0,"x":-55});tl.to('#s1-prompt',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},1.65);tl.fromTo('#s1-heading',{opacity:0,x:-35},{opacity:1,x:0,duration:.6},0);tl.fromTo('#s1-progress',{scaleX:0},{scaleX:1,duration:34.333333333333336,ease:'none'},0);window.__timelines['s1']=tl;}</script></template></body></html>
