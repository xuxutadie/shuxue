rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/></g><text x="150" y="200" fill="#243047" font-size="64" font-weight="600">7</text><text x="78" y="295" fill="#243047" font-size="29" font-weight="600">1、7</text><text x="78" y="385" fill="#243047" font-size="32" font-weight="600">恰好2个</text><g id="s4-card1"><rect x="364" y="120" width="275" height="350" rx="20" fill="#243047"/><rect x="360" y="115" width="275" height="350" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/></g><text x="455" y="200" fill="#243047" font-size="64" font-weight="600">8</text><text x="383" y="295" fill="#243047" font-size="29" font-weight="600">1、2、4、8</text><text x="383" y="385" fill="#243047" font-size="32" font-weight="600">多于2个</text><g id="s4-card2"><rect x="669" y="120" width="275" height="350" rx="20" fill="#243047"/><rect x="665" y="115" width="275" height="350" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/></g><text x="760" y="200" fill="#243047" font-size="64" font-weight="600">1</text><text x="688" y="295" fill="#243047" font-size="29" font-weight="600">1</text><text x="688" y="385" fill="#243047" font-size="32" font-weight="600">只有1个</text><text x="45" y="620" fill="#243047" font-size="32" font-weight="600">大于1，并且恰有两个正因数，才是质数。</text><g id="s4-note0"><rect x="1044" y="40" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="35" width="680" height="125" rx="20" fill="#FFD43B" stroke="#243047" stroke-width="3"/><text x="1065" y="84" fill="#243047" font-size="33" font-weight="600">7：1、7 → 质数</text></g><g id="s4-note1"><rect x="1044" y="193" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="188" width="680" height="125" rx="20" fill="#45C7FF" stroke="#243047" stroke-width="3"/><text x="1065" y="237" fill="#243047" font-size="33" font-weight="600">8：1、2、4、8 → 合数</text></g><g id="s4-note2"><rect x="1044" y="346" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="341" width="680" height="125" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="1065" y="390" fill="#243047" font-size="33" font-weight="600">1：只有1个正因数</text></g><g id="s4-note3"><rect x="1044" y="499" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="494" width="680" height="125" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="1065" y="543" fill="#243047" font-size="33" font-weight="600">2是质数；9不是质数</text></g></svg><div class="clip subtitle" id="s4-cap0" data-start="0.75" data-duration="7.844" data-track-index="5">七只有一和七两个正因数，像这样大于一、恰有两个正因数的整数，叫质数。</div><div class="clip subtitle" id="s4-cap1" data-start="9.294" data-duration="5.524999800000001" data-track-index="5">八还有二和四这些因数，正因数多于两个，叫合数。</div><div class="clip subtitle" id="s4-cap2" data-start="14.8189998" data-duration="4.9350002" data-track-index="5">九虽然是奇数，但还能被三整除，也是合数。</div><div class="clip subtitle" id="s4-cap3" data-start="20.454" data-duration="3.4054347" data-track-index="5">一只有一个正因数，就是一自己。</div><div class="clip subtitle" id="s4-cap4" data-start="23.859434699999998" data-duration="5.806565299999999" data-track-index="5">因此一既不是质数，也不是合数，不能放进任何一边。</div><div class="clip subtitle" id="s4-cap5" data-start="30.366" data-duration="5.4842390000000005" data-track-index="5">二的正因数是一和二，它是质数，也是唯一的偶质数。</div><div class="clip subtitle" id="s4-cap6" data-start="35.850239" data-duration="3.727760999999999" data-track-index="5">其他大于二的偶数，还会有因数二。</div><div class="progress" id="s4-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});tl.to('#s4-card0',{"duration":0.4,"ease":"power2.inOut","scale":1.035,"transformOrigin":"50% 50%","yoyo":true,"repeat":1},1.65);tl.to('#s4-card1',{"duration":0.4,"ease":"power2.inOut","scale":1.035,"transformOrigin":"50% 50%","yoyo":true,"repeat":1},10.194);tl.to('#s4-card2',{"duration":0.4,"ease":"power2.inOut","scale":1.035,"transformOrigin":"50% 50%","yoyo":true,"repeat":1},21.354);gsap.set('#s4-note0',{"opacity":0,"x":55});tl.to('#s4-note0',{"duration":0.85,"ease":"power2.i
