40" y="341" width="680" height="125" rx="20" fill="#B395FF" stroke="#243047" stroke-width="3"/><text x="1065" y="390" fill="#243047" font-size="33" font-weight="600">6×6：只记一个6</text></g><g id="s7-note3"><rect x="1044" y="499" width="680" height="125" rx="20" fill="#243047"/><rect x="1040" y="494" width="680" height="125" rx="20" fill="#62DDB5" stroke="#243047" stroke-width="3"/><text x="1065" y="543" fill="#243047" font-size="33" font-weight="600">不同因数共9个</text></g></svg><div class="clip subtitle" id="s7-cap0" data-start="0.75" data-duration="6.679891100000001" data-track-index="5">从一开始配对，一和三十六、二和十八、三和十二、四和九。</div><div class="clip subtitle" id="s7-cap1" data-start="7.429891100000001" data-duration="4.2361089" data-track-index="5">每找到一对，就同时记下左右两个因数。</div><div class="clip subtitle" id="s7-cap2" data-start="12.366" data-duration="2.2913042999999997" data-track-index="5">五不能整除三十六。</div><div class="clip subtitle" id="s7-cap3" data-start="14.6573043" data-duration="2.6766303000000002" data-track-index="5">来到六，得到六乘六。</div><div class="clip subtitle" id="s7-cap4" data-start="17.3339346" data-duration="4.748065400000001" data-track-index="5">这一次左右写的是同一个数，只能记录一个六。</div><div class="clip subtitle" id="s7-cap5" data-start="22.782" data-duration="6.2586955" data-track-index="5">前面四对带来八个不同的因数，加上中间的六，总共有九个。</div><div class="clip subtitle" id="s7-cap6" data-start="29.040695499999998" data-duration="4.1293045" data-track-index="5">不能把每一对都机械地乘二，得到十个。</div><div class="clip subtitle" id="s7-cap7" data-start="33.870000000000005" data-duration="4.2885868" data-track-index="5">继续试九乘四，又回到已经记录过的一对。</div><div class="clip subtitle" id="s7-cap8" data-start="38.1585868" data-duration="3.125" data-track-index="5">配对已经相遇，就可以停止。</div><div class="clip subtitle" id="s7-cap9" data-start="41.2835868" data-duration="3.5744131999999995" data-track-index="5">这样既不漏掉，也不会重复计数。</div><div class="progress" id="s7-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#s7-left0',{"op
