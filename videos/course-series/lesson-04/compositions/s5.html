div class="clip subtitle" id="s5-cap2" data-start="11.43" data-duration="6.1635868" data-track-index="5">末端是二、二、二、三，已经全部是质数，就可以停止。</div><div class="clip subtitle" id="s5-cap3" data-start="17.5935868" data-duration="3.2884132" data-track-index="5">二十四等于二乘二乘二乘三。</div><div class="clip subtitle" id="s5-cap4" data-start="21.582" data-duration="9.884" data-track-index="5">换一种起点，先拆成三乘八，再把八拆成二乘四，四拆成二乘二，得到的质因数仍然相同。</div><div class="clip subtitle" id="s5-cap5" data-start="32.166000000000004" data-duration="7.5766302" data-track-index="5">检查时把末端乘回去，二乘二得四，再乘二得八，再乘三得二十四。</div><div class="clip subtitle" id="s5-cap6" data-start="39.7426302" data-duration="4.1313698" data-track-index="5">不能停在四乘六，因为它们还不是质数。</div><div class="progress" id="s5-progress"></div></div></div><script>{const tl=gsap.timeline({paused:true});gsap.set('#s5-edge0',{"opacity":0,"y":24});tl.to('#s5-edge0',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},0.65);gsap.set('#s5-edge1',{"opacity":0,"y":24});tl.to('#s5-edge1',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},0.87);gsap.set('#s5-edge2',{"opacity":0,"y":24});tl.to('#s5-edge2',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},11.77);gsap.set('#s5-edge3',{"opacity":0,"y":24});tl.to('#s5-edge3',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},11.99);gsap.set('#s5-edge4',{"opacity":0,"y":24});tl.to('#s5-edge4',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},12.21);gsap.set('#s5-edge5',{"opacity":0,"y":24});tl.to('#s5-edge5',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},12.43);gsap.set('#s5-node1',{"opacity":0,"y":-55});tl.to('#s5-node1',{"duration":0.85,"ease":"power2.inOut","opacity":1,"x":0,"y":0,"scaleX":1,"rotation":0},0.88);gsap.set('#s5-node2',{"opacity":0,"y":-55});tl.to('#s5-node2',{"duration":0.85,"ease":"power2.inOut",
